<!doctype html>
<html lang="zh-CN" data-board="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teamo 双端 UI 实验室 · 清晰成长方向 2026-10-09</title>
<style>
/* ══════════════════════════════════════════════════════════════
   0 · 看板外壳（深色，便于手机屏照出对比）
   ══════════════════════════════════════════════════════════════ */
:root{
  --bd-bg:#0a0e13; --bd-panel:#101720; --bd-panel2:#0d131a; --bd-ink:#e4ecf4;
  --bd-muted:#7f8d9c; --bd-line:#1d2836; --bd-line2:#22303f;
  --bd-accent:#c6ff45; --bd-accent2:#5ac8fa; --bd-warn:#f5a623;
  --phone-zoom:.62;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 12% -8%, #16232f 0, transparent 60%),
    radial-gradient(900px 500px at 92% 4%, #1b2530 0, transparent 55%),
    var(--bd-bg);
  color:var(--bd-ink); min-height:100vh;
  font:15px/1.7 Inter,"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--bd-accent2);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1560px;margin:0 auto;padding:30px 26px 90px}

/* ---- 顶栏 ---- */
.board-top{
  position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);
  background:rgba(10,14,19,.86);border-bottom:1px solid var(--bd-line);
}
.board-top .in{max-width:1560px;margin:0 auto;padding:14px 26px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--bd-muted)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--bd-panel);border:1px solid var(--bd-line);border-radius:11px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:var(--bd-muted);font:inherit;font-size:13px;
  padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.seg button:hover{color:var(--bd-ink)}
.seg button[aria-pressed="true"]{background:var(--bd-accent);color:#131a06;font-weight:700}
.seg .lbl{padding:7px 6px 7px 11px;font-size:12px;color:var(--bd-muted)}

/* ---- 标题区 ---- */
.lede{margin:34px 0 8px}
.lede h1{font-size:38px;line-height:1.2;margin:0 0 12px;letter-spacing:-.5px}
.lede .kicker{font-size:12px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--bd-accent);margin:0 0 10px}
.lede p{color:var(--bd-muted);margin:0;max-width:1000px}
.lede p+p{margin-top:8px}

/* ---- 通用面板 ---- */
.panel{background:var(--bd-panel);border:1px solid var(--bd-line);border-radius:16px;padding:20px 22px;margin:22px 0}
.panel h2{font-size:19px;margin:0 0 4px;letter-spacing:.2px}
.panel h2 em{font-style:normal;color:var(--bd-accent);font-size:13px;font-weight:700;letter-spacing:1.5px;margin-left:10px;text-transform:uppercase}
.panel h3{font-size:15px;margin:18px 0 8px}
.panel p{color:var(--bd-muted);margin:6px 0}
.panel ul{color:var(--bd-muted);margin:8px 0;padding-left:20px}
.panel li{margin:5px 0}
.hr{height:1px;background:var(--bd-line);margin:16px 0}

/* ---- 表格 ---- */
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--bd-line);vertical-align:top}
th{color:var(--bd-muted);font-weight:600;font-size:12px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
td b{color:var(--bd-ink);font-weight:650}
code{font:12.5px/1.5 "SF Mono",Consolas,monospace;background:#0b1118;border:1px solid var(--bd-line);border-radius:5px;padding:1px 6px;color:#c9e5b0}
.sw{display:inline-flex;align-items:center;gap:7px;font:12px/1 "SF Mono",Consolas,monospace}
.sw i{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.22);display:inline-block;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--bd-line);color:var(--bd-muted)}
.tag.ok{color:#a8e05f;border-color:#3b5b17;background:#1a2409}
.tag.warn{color:#f5c26b;border-color:#5c4315;background:#241c08}
.tag.bad{color:#f08a7a;border-color:#5c2620;background:#240f0c}

/* ---- 方向分区 ---- */
.dir{margin:40px 0 8px;padding-top:26px;border-top:1px solid var(--bd-line)}
.dir-head{display:flex;align-items:flex-start;gap:18px;flex-wrap:wrap}
.dir-no{
  flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  font-size:20px;font-weight:800;background:var(--bd-panel);border:1px solid var(--bd-line);
}
.dir-head h2{margin:0;font-size:24px;letter-spacing:-.2px}
.dir-head .sub{color:var(--bd-muted);margin:4px 0 0;font-size:13.5px}
.dir-head .src{margin-left:auto;font-size:12px;color:var(--bd-muted);text-align:right;max-width:340px}

/* ---- 手机条带 ---- */
.strip{
  display:flex;gap:34px;align-items:flex-start;overflow-x:auto;padding:26px 4px 18px;
  scrollbar-width:thin;
}
.strip::-webkit-scrollbar{height:9px}
.strip::-webkit-scrollbar-thumb{background:#1f2b39;border-radius:9px}
.slot{flex:none;display:flex;flex-direction:column;align-items:center;gap:14px}
.slot-cap{width:100%;max-width:340px;text-align:center}
.slot-cap b{display:block;font-size:13.5px;color:var(--bd-ink)}
.slot-cap small{display:block;color:var(--bd-muted);font-size:12px;line-height:1.6;margin-top:3px}
.slot-cap .hintline{display:block;margin-top:6px;font-size:11.5px;color:#5f6d7c}
.badge-v{font-size:10.5px;font-weight:800;letter-spacing:1.2px;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.badge-v.restore{background:#152a12;color:#a8e05f;border:1px solid #33541a}
.badge-v.diverge{background:#12222e;color:#6fd0f5;border:1px solid #1d4256}

/* ══════════════════════════════════════════════════════════════
   1 · 纯 CSS iPhone 13 / 14 Pro / 15 Pro / 16 Pro 机身
   （参考开源方案 react-device-bezels (MIT) 的纯 CSS 思路与
     device-frames 的机型视口规格，本页自绘，零外部资源）
   ══════════════════════════════════════════════════════════════ */
.phone{
  --w:390px; --h:844px; --r:56px;      /* 机身圆角 */
  --sr:47px;                           /* 屏幕圆角 */
  --bezel:11px;
  position:relative;width:calc(var(--w) + var(--bezel)*2);height:calc(var(--h) + var(--bezel)*2);
  border-radius:calc(var(--r) + var(--bezel));
  padding:var(--bezel);
  zoom:var(--phone-zoom);
  background:
    linear-gradient(145deg,#6b6f75 0%,#2c3034 18%,#1b1e21 50%,#33383d 82%,#7a7f86 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.28) inset,
    0 -1px 0 rgba(0,0,0,.6) inset,
    0 26px 54px rgba(0,0,0,.62),
    0 3px 8px rgba(0,0,0,.4);
}
/* 金属边框高光 */
.phone::before{
  content:"";position:absolute;inset:calc(var(--bezel) - 2.5px);border-radius:calc(var(--r) + 2.5px);
  box-shadow:0 0 0 1.5px rgba(255,255,255,.14), 0 0 0 3px rgba(0,0,0,.5);
  pointer-events:none;z-index:4;
}
/* 侧键 */
.phone::after{
  content:"";position:absolute;left:-2.5px;top:22%;width:3px;height:7%;border-radius:3px;
  background:linear-gradient(180deg,#8b9097,#4d5257);box-shadow:0 44px 0 0 #6c7176,0 84px 0 0 #6c7176,0 0 0 1px rgba(0,0,0,.4);
  z-index:5;
}
.phone .btn-r{position:absolute;right:-2.5px;top:30%;width:3px;height:11%;border-radius:3px;
  background:linear-gradient(180deg,#8b9097,#4d5257);box-shadow:0 0 0 1px rgba(0,0,0,.4);z-index:5}

.screen{
  position:relative;width:100%;height:100%;border-radius:var(--sr);overflow:hidden;
  background:#fff;display:flex;flex-direction:column;isolation:isolate;
}
/* 灵动岛 / 刘海 */
.island{
  position:absolute;z-index:30;left:50%;transform:translateX(-50%);
  top:11px;width:124px;height:35px;border-radius:20px;background:#000;
}
.island::after{content:"";position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:9px;height:9px;border-radius:50%;background:#0d1420;
  box-shadow:inset 0 0 0 1px #1d2b3d, 0 0 3px #12253a}
.notch{
  position:absolute;z-index:30;left:50%;transform:translateX(-50%);
  top:0;width:158px;height:30px;border-radius:0 0 20px 20px;background:#000;
}
.notch::before{content:"";position:absolute;left:50%;top:0;transform:translateX(-50%);
  width:52px;height:5px;border-radius:0 0 5px 5px;background:#0a0a0a;
  box-shadow:0 0 0 1px #141414}
.notch::after{content:"";position:absolute;right:26px;top:50%;transform:translateY(-50%);
  width:7px;height:7px;border-radius:50%;background:#101826;box-shadow:inset 0 0 0 1px #1a2740}
/* 安卓中置挖孔（三星/OPPO 等） */
.punch{
  position:absolute;z-index:30;left:50%;top:13px;transform:translateX(-50%);
  width:12px;height:12px;border-radius:50%;background:#000;
  box-shadow:inset 0 0 0 1px #1c1c1c, 0 0 2px rgba(0,0,0,.5);
}
.punch::after{content:"";position:absolute;right:-15px;top:50%;transform:translateY(-50%);
  width:8px;height:8px;border-radius:50%;background:#0d1420;box-shadow:inset 0 0 0 1px #1d2b3d}
/* 状态栏 */
.statusbar{
  position:absolute;z-index:31;top:0;left:0;right:0;height:50px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13.5px;font-weight:650;letter-spacing:.2px;
  color:var(--sb,#0d1216);pointer-events:none;
}
.statusbar .r{display:flex;align-items:center;gap:5px}
.statusbar svg{width:16px;height:11px;display:block}
/* home indicator */
.homebar{
  position:absolute;z-index:31;bottom:8px;left:50%;transform:translateX(-50%);
  width:136px;height:5px;border-radius:5px;background:var(--hb,rgba(0,0,0,.72));
}
/* 机型视口：每个 data-model 设定机身像素尺寸；缺口类型由 data-notch 决定 */
.phone[data-model="ip13"]   {--w:390px; --h:844px}
.phone[data-model="ip14p"]  {--w:393px; --h:852px}
.phone[data-model="ip15p"]  {--w:393px; --h:852px}
.phone[data-model="ip16p"]  {--w:402px; --h:874px}
.phone[data-model="ip16pm"] {--w:430px; --h:932px}
.phone[data-model="hwmt60"] {--w:393px; --h:852px}
.phone[data-model="hwpr70"] {--w:393px; --h:852px}
.phone[data-model="opfx7"]  {--w:393px; --h:852px}
.phone[data-model="oprn12"] {--w:393px; --h:852px}
.phone[data-model="ss24u"]  {--w:412px; --h:915px}
.phone[data-model="ss24"]   {--w:384px; --h:864px}
/* 缺口三种：刘海 / 灵动岛 / 挖孔，默认全部隐藏，由 data-notch 决定显示哪一个 */
.phone .notch, .phone .island, .phone .punch{display:none}
.phone[data-notch="刘海"]   .notch {display:block}
.phone[data-notch="灵动岛"] .island{display:block}
.phone[data-notch="挖孔"]   .punch {display:block}

/* 屏幕内滚动内容 */
.sc{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;
  padding-top:52px;background:var(--bg);color:var(--ink)}
.sc-pad{padding-left:20px;padding-right:20px}
.sc-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.sc-scroll::-webkit-scrollbar{width:0}
/* ══════════════════════════════════════════════════════════════
   2 · 设计令牌（Skin）——风格差异全部收敛到这一层
   默认值挂在 .phone 上，[data-skin] 同权重但更靠后 → 覆盖默认；
   .sc 不重复声明，只继承。这样"换皮肤 = 换一个 data-skin"。
   ══════════════════════════════════════════════════════════════ */
.phone{
  --bg:#fff; --bg-grad:var(--bg); --surface:#fff; --surface2:#f4f4f4;
  --ink:#101010; --ink2:#3a3a3a; --muted:#8b8b8b; --line:#e9e9e9;
  --brand:#c6ff45; --brand-ink:#111; --accent:#111; --accent-ink:#fff;
  --track:#e4e4e4; --ok:#8fce3f; --wait:#f0a93c; --off:#b9b9b9;
  --ring-core:#fff;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --sb:#0d1216; --hb:rgba(0,0,0,.72);
  --dev-bg:#0e1210; --dev-ink:#fff; --dev-track:#2c332e;
  --mega-weight:900; --mega-track:-.02em;
  --run-bg:#0e1210; --run-ink:#fff; --run-num:#fff; --run-brand:#c6ff45;
  --run-track:#2c332e; --run-core:#0e1210; --run-cap:#fff;
}

/* ── 方向一 · 清晰成长（还原 = 参考图 1） ── */
[data-skin="clear"]{
  --bg:#F6FAF1; --surface:#FFFFFF; --surface2:#F1F5EA;
  --ink:#16201A; --ink2:#3D4A42; --muted:#8B968E; --line:#E9EEE2;
  --brand:#A6E22E; --brand-ink:#16201A; --accent:#16201A; --accent-ink:#FFFFFF;
  --track:#E3E8DA; --ok:#A6E22E; --wait:#F2A93B; --off:#B9C2BB;
  --ring-core:#F6F8F2; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(22,32,26,.05);
  --dev-bg:#0E1210; --dev-ink:#FFFFFF; --dev-track:#2C332E;
}
[data-skin="clear-d2"]{
  --bg:#101512; --surface:#1A211C; --surface2:#141A16;
  --ink:#F2F6EF; --ink2:#C3CCC4; --muted:#7E8B82; --line:#26302A;
  --brand:#C6FF45; --brand-ink:#101507; --accent:#C6FF45; --accent-ink:#101507;
  --track:#2C332E; --ok:#C6FF45; --wait:#F5B940; --off:#6E7A72;
  --ring-core:#0C110E; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:none; --sb:#F2F6EF; --hb:rgba(255,255,255,.75);
  --dev-bg:#0A0D0B; --dev-ink:#FFFFFF; --dev-track:#2C332E;
}
[data-skin="clear-d3"]{
  --bg:#FAFBF8; --surface:#FFFFFF; --surface2:#F2F4F0;
  --ink:#1C211E; --ink2:#454D48; --muted:#848B86; --line:#E8EAE6;
  --brand:#7FB43A; --brand-ink:#FFFFFF; --accent:#1C211E; --accent-ink:#FFFFFF;
  --track:#E6E9E4; --ok:#7FB43A; --wait:#E5A02F; --off:#B4BAB6;
  --ring-core:#FFFFFF; --r-lg:16px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 1px rgba(28,33,30,.04);
  --dev-bg:#111511; --dev-ink:#FFFFFF; --dev-track:#2A302B;
}

/* ── 方向二 · 温暖陪伴屋（还原 = 参考图 2） ── */
[data-skin="warm"]{
  --bg:#FDF8EF; --bg-grad:linear-gradient(168deg,#EFE9FC 0%,#FDF6EC 48%,#FBF3E5 100%);
  --surface:#FFFFFF; --surface2:#F3EEFB;
  --ink:#2E2A3D; --ink2:#4A4459; --muted:#837C96; --line:#EDE7F6;
  --brand:#6C5CE0; --brand-ink:#FFFFFF; --accent:#F5C34A; --accent-ink:#4A3812;
  --track:#E6E0F6; --ok:#7BC47F; --wait:#F5A623; --off:#BEB7CC;
  --ring-core:#FFFFFF; --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 4px 14px rgba(84,70,140,.07);
  --dev-bg:#26203B; --dev-ink:#FFFFFF; --dev-track:#3C3457;
}
[data-skin="warm-d2"]{
  --bg:#FAF8FF; --bg-grad:linear-gradient(168deg,#F3EFFC,#FCFAFF 60%);
  --surface:#FFFFFF; --surface2:#F2EEFC;
  --ink:#2A2739; --ink2:#494657; --muted:#7E7B8E; --line:#EAE6F3;
  --brand:#6C5CE0; --brand-ink:#FFFFFF; --accent:#E9E4F9; --accent-ink:#3D3560;
  --track:#E7E3F4; --ok:#6FB573; --wait:#EE9F2C; --off:#BEB9CB;
  --ring-core:#FFFFFF; --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 2px 8px rgba(80,70,130,.06);
  --dev-bg:#2A2440; --dev-ink:#FFFFFF; --dev-track:#3E3760;
}
[data-skin="warm-d3"]{
  --bg:#FBF5EC; --bg-grad:linear-gradient(168deg,#F6EBDC,#FCF7F0 58%);
  --surface:#FFFDF9; --surface2:#F4EAD9;
  --ink:#2F2C27; --ink2:#4C4740; --muted:#857C6E; --line:#EDE2CF;
  --brand:#B75535; --brand-ink:#FFFFFF; --accent:#315B53; --accent-ink:#FFFFFF;
  --track:#E9DDC9; --ok:#3F7A63; --wait:#D98A2B; --off:#C0B6A6;
  --ring-core:#FFFDF9; --r-lg:24px; --r-md:16px; --r-sm:11px;
  --shadow:0 3px 10px rgba(90,70,45,.07);
  --dev-bg:#241F1A; --dev-ink:#FFFFFF; --dev-track:#3A3229;
}

/* ── 方向三 · 活力运动场（还原 = 参考图 3） ── */
[data-skin="arena"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F4F4;
  --ink:#0E1512; --ink2:#33403A; --muted:#77837D; --line:#E2E7E5;
  --brand:#0FC3A8; --brand-ink:#FFFFFF; --accent:#5B2BE8; --accent-ink:#FFFFFF;
  --track:rgba(255,255,255,.34); --ok:#0FC3A8; --wait:#E8A93C; --off:#A9B4AF;
  --ring-core:#0B3F38; --r-lg:6px; --r-md:5px; --r-sm:4px;
  --shadow:none; --mega-weight:900; --mega-track:-.045em;
  --dev-bg:#0B3F38; --dev-ink:#FFFFFF; --dev-track:rgba(255,255,255,.3);
}
[data-skin="arena-d2"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1F6F5;
  --ink:#121816; --ink2:#3A4440; --muted:#7A847F; --line:#E4EAE8;
  --brand:#BDF52D; --brand-ink:#111816; --accent:#111816; --accent-ink:#FFFFFF;
  --track:rgba(255,255,255,.36); --ok:#BDF52D; --wait:#E8A93C; --off:#A9B4AF;
  --ring-core:#111816; --r-lg:8px; --r-md:6px; --r-sm:5px;
  --shadow:none; --mega-weight:900; --mega-track:-.045em;
  --dev-bg:#111816; --dev-ink:#FFFFFF; --dev-track:rgba(189,245,45,.28);
}
[data-skin="arena-d3"]{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F4F4;
  --ink:#0E1512; --ink2:#33403A; --muted:#77837D; --line:#E2E7E5;
  --brand:#0FC3A8; --brand-ink:#FFFFFF; --accent:#5B2BE8; --accent-ink:#FFFFFF;
  --track:#DCE3E0; --ok:#0FC3A8; --wait:#E8A93C; --off:#A9B4AF;
  --ring-core:#0B3F38; --r-lg:10px; --r-md:8px; --r-sm:6px;
  --shadow:none; --mega-weight:900; --mega-track:-.045em;
  --dev-bg:#0B3F38; --dev-ink:#FFFFFF; --dev-track:rgba(255,255,255,.3);
}

/* ══════════════════════════════════════════════════════════════
   3 · 屏内组件（结构共用，皮肤驱动外观）
   ══════════════════════════════════════════════════════════════ */
.sc{background:var(--bg-grad);}
.sc[data-screen="running"]{}
.nums{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* 顶部行 */
.h-row{display:flex;align-items:center;gap:12px;padding:6px 20px 12px}
.h-row .back{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--ink2);margin-left:-6px}
.h-title{flex:1;font-size:17.5px;font-weight:750;letter-spacing:-.2px}
.h-title small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:3px}
.h-act{font-size:16px;color:var(--muted)}
.h-act.close{font-size:19px}

/* 孩子条 */
.kid-chip{display:flex;align-items:center;gap:11px}
.ava{
  width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:16px;font-weight:750;color:var(--brand-ink);
  background:var(--brand);box-shadow:var(--shadow);
}
.ava.photo{background:linear-gradient(150deg,#FFD9A8,#F0B27A);color:#5A3410}
.kid-chip b{display:block;font-size:16px;font-weight:750;line-height:1.25}
.kid-chip small{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.chev{color:var(--muted);font-size:17px;flex:none}
.dotn{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dotn.off{background:var(--off)}
.dotn.wait{background:var(--wait)}

/* 卡片 */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card.tint{background:var(--surface2)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.2px}
.sub{font-size:15px;font-weight:700;color:var(--ink);margin-top:3px}
.sec{font-size:14px;font-weight:750;color:var(--ink);padding:20px 0 9px}
.mut{color:var(--muted)}

/* 环形进度 */
.ringwrap{display:grid;place-items:center;padding:14px 0 4px}
.ring{
  --p:60; --sz:148px;
  width:var(--sz);height:var(--sz);border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--brand) calc(var(--p) * 1%), var(--track) 0);
}
.ring::before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--ring-core)}
.ring-in{position:relative;text-align:center;line-height:1}
.ring-in b{display:block;font-size:44px;font-weight:850;color:var(--ink);letter-spacing:-1.5px}
.ring-in small{display:block;font-size:13px;color:var(--muted);margin-top:5px}

/* 细进度条 */
.bar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand);width:60%}

/* 列表行 */
.rowitem{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow)}
.rowitem b{font-size:14.5px;font-weight:700}
.rowitem .grow{flex:1;min-width:0}
.rico{width:34px;height:34px;border-radius:var(--r-sm);flex:none;display:grid;place-items:center;font-size:15px;background:var(--surface2);color:var(--brand-ink);font-weight:800}
.rico.solid{background:var(--brand);color:var(--brand-ink)}
.prog-txt{font-size:14px;font-weight:750;color:var(--ink2)}

/* 按钮 */
.btn{
  border:0;font:inherit;cursor:default;display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;min-height:50px;border-radius:var(--r-md);font-size:15.5px;font-weight:750;letter-spacing:.2px;
  background:var(--brand);color:var(--brand-ink);
}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.line{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.slim{min-height:44px;font-size:14.5px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.btn-pill{min-height:44px;border-radius:99px}
.foot{padding:14px 20px 26px;display:flex;flex-direction:column;gap:10px}

/* 表单行 */
.frow{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--surface);border-radius:var(--r-md);box-shadow:var(--shadow);margin-bottom:10px}
.frow .k{font-size:13px;color:var(--muted);width:74px;flex:none}
.frow .v{flex:1;font-size:15.5px;font-weight:750;color:var(--ink)}
.frow .chev{font-size:16px}
.frow.box .v{background:var(--surface2);border-radius:var(--r-sm);padding:11px 14px}

/* 步骤 */
.steps{display:flex;align-items:center;gap:8px;padding:2px 20px 16px}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;font-style:normal;background:var(--track);color:var(--muted)}
.step.on{color:var(--ink)}
.step.on i{background:var(--brand);color:var(--brand-ink)}
.step-line{flex:1;height:1.5px;background:var(--line);min-width:14px}
.stepbig{display:flex;flex-direction:column;gap:22px;padding:6px 0}
.stepbig .it{display:flex;gap:12px}
.stepbig .n{width:25px;height:25px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--brand);color:var(--brand-ink)}
.stepbig .k{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:8px}

/* 大数选择器 */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--r-lg);padding:12px 16px;box-shadow:var(--shadow)}
.stepper .n{display:flex;align-items:baseline;gap:6px}
.stepper .n b{font-size:54px;font-weight:900;letter-spacing:-2px;line-height:.95;color:var(--ink)}
.stepper .n small{font-size:14px;color:var(--muted)}
.pm{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;font-weight:600;
  background:var(--surface2);color:var(--ink)}

/* 巨字海报 */
.mega{padding:0 20px;line-height:.86;letter-spacing:var(--mega-track);font-weight:var(--mega-weight)}
.mega .l1{display:block;font-size:46px}
.mega .l2{display:block;font-size:104px;display:flex;align-items:baseline;gap:8px}
.mega .l2 small{font-size:26px;font-weight:800;letter-spacing:0}
.mega.med .l1{font-size:34px}
.mega.med .l2{font-size:76px}
.mega.med .l2 small{font-size:20px}

/* 大计数（运动页） */
.countwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 20px}
.bigcount{display:flex;align-items:baseline;gap:8px;line-height:.9;font-weight:900;letter-spacing:-.04em;color:var(--dev-ink)}
.bigcount b{font-size:86px}
.bigcount small{font-size:26px;font-weight:750;opacity:.72}
.eyebrow{font-size:13.5px;font-weight:750;letter-spacing:1.6px;text-transform:uppercase;opacity:.66}
.sport-name{font-size:20px;font-weight:800;letter-spacing:.4px;color:var(--dev-ink)}

/* 阶段轨道（arena） */
.track-v{position:absolute;right:22px;top:96px;bottom:150px;width:12px;border-radius:9px;
  background:rgba(255,255,255,.18);overflow:hidden}
.track-v i{position:absolute;left:0;right:0;top:0;height:60%;background:#fff;border-radius:9px;opacity:.9}
.track-v.dk{background:var(--surface2)}
.track-v.dk i{background:var(--brand)}

/* 角色（自绘 SVG 圆润小体） */
.blob{display:block}
.blob .body{fill:var(--brand)}
.blob .eye{fill:var(--brand-ink)}
.blob.warm .body{fill:#CFC6F5}
.blob.warm .eye{fill:#3A3358}
.blob.dark .body{fill:#2E3A33}
.blob.dark .eye{fill:#C6FF45}
.charwrap{display:grid;place-items:center}
.charwrap svg{filter:drop-shadow(0 12px 22px rgba(0,0,0,.22))}

/* 状态行 */
.stats{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow)}
.srow{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .ic{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800}
.srow .ic.ok{background:var(--brand);color:var(--brand-ink)}
.srow .ic.wait{background:#FDEFD6;color:#B87B14}
.srow .ic.save{background:var(--surface2);color:var(--ink2)}
.srow .k{flex:1;font-size:13.5px;color:var(--ink2)}
.srow .v{font-size:13.5px;font-weight:750}
.srow .v.ok{color:var(--ink)}
.srow .v.wait{color:var(--wait)}

/* 结果大勾 */
.bigcheck{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;
  background:var(--brand);color:var(--brand-ink);font-size:48px;font-weight:900;line-height:1}
.result-h{text-align:center;padding:8px 20px 0}
.result-h b{display:block;font-size:22px;font-weight:850;letter-spacing:-.3px}
.result-h .big{font-size:62px;font-weight:900;letter-spacing:-2.5px;line-height:1.05;margin-top:2px}
.result-h .big small{font-size:26px;font-weight:750;color:var(--muted);letter-spacing:0}
.result-h p{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* 设备状态条 */
.devbar{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r-md);
  background:var(--surface);box-shadow:var(--shadow)}
.devbar .cube{width:32px;height:32px;border-radius:var(--r-sm);flex:none;background:var(--surface2);display:grid;place-items:center}
.devbar .cube::after{content:"";width:14px;height:14px;border-radius:4px;background:var(--brand)}
.devbar b{display:block;font-size:13.5px;font-weight:750}
.devbar small{display:block;font-size:11.5px;color:var(--muted)}

/* 说明条 */
.note{font-size:12.5px;color:var(--muted);line-height:1.65;padding:0 20px}
.note b{color:var(--ink2);font-weight:700}

/* 插画区（自绘矢量，不复用参考作品素材） */
.illu{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--bg-grad,var(--surface2));
  display:grid;place-items:center;flex:none}
.illu.sm{height:150px}
.illu.md{height:210px}
.illu.lg{flex:1;min-height:0;border-radius:0}
.room{position:absolute;inset:0}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:26%}
.room .win{position:absolute;border-radius:8px 8px 0 0}
.room .plant{position:absolute;bottom:22%;width:44px;height:64px;border-radius:22px 22px 6px 6px}
.speech{position:absolute;background:#fff;border-radius:14px 14px 14px 3px;padding:8px 12px;font-size:12px;
  font-weight:700;color:var(--ink);box-shadow:var(--shadow);max-width:130px;line-height:1.4}

/* 大按钮（arena 紫色） */
.btn.xl{min-height:62px;font-size:17px;font-weight:800;letter-spacing:.4px}
.qbtn{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.24);color:#fff;font-size:15px;font-weight:800;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}

/* 卡片堆叠间距容器 */
.stack{display:flex;flex-direction:column;gap:11px;padding:0 20px}
.stack.tight{gap:8px}

/* 布局模型 */
.sc[data-layout="poster"]{padding-top:0}
.sc[data-layout="poster"] .statusbar{color:var(--brand-ink)}
.sc[data-layout="poster"] .homebar{background:rgba(255,255,255,.8)}
.poster-body{padding:54px 24px 22px;background:var(--brand);color:var(--brand-ink);flex:1;
  display:flex;flex-direction:column;min-height:0}
.poster-body .kicker-row{display:flex;align-items:center;gap:12px}
.poster-body .kicker-row b{font-size:17px;font-weight:850}
.poster-body .kicker-row small{display:block;font-size:12px;opacity:.8;font-weight:600}
.poster-body .mega{margin:22px 0 10px;padding:0}
.poster-body .mega .l2 small{font-size:28px}
.poster-body .lead{font-size:13.5px;opacity:.88;line-height:1.7;margin:0}
.split-body{flex:1;display:flex;flex-direction:column;min-height:0}
.split-hero{height:38%;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;justify-content:flex-end;padding:56px 22px 18px}
.split-hero .mega{padding:0}
.split-hero .mega .l1{font-size:26px}
.split-hero .mega .l2{font-size:60px}
.split-hero .mega .l2 small{font-size:17px}
.split-hero .lead{font-size:12.5px;opacity:.9;margin:8px 0 0}
.split-body .rest{flex:1;min-height:0;overflow:hidden;padding:0 20px}

/* 圆角/方角徽标 */
.corner-tag{position:absolute;top:0;left:0;right:0;height:5px;background:var(--brand)}

/* ══════════════════════════════════════════════════════════════
   4 · 设备端（圆屏 1.8″ 360×360）
   ══════════════════════════════════════════════════════════════ */
.dev-row{display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start}
.dev-unit{display:flex;flex-direction:column;align-items:center;gap:11px}
.dev-cap{text-align:center;max-width:300px}
.dev-cap b{display:block;font-size:13px;color:var(--bd-ink)}
.dev-cap small{display:block;font-size:11.5px;color:var(--bd-muted);margin-top:2px}
.dev-body{position:relative;width:290px;padding:31px 20px 30px;border-radius:92px;
  background:linear-gradient(172deg,#fdfdfc,#f1f0ee 58%,#e5e3e0);
  box-shadow:0 18px 44px rgba(0,0,0,.5),inset 0 1px 2px #fff,inset 0 -2px 5px #d8d5d0}
/* 顶部摄像头模组：黑胶囊 + 左镜头 + 右橙滑盖（参考渲染图 2026-10-09）；closed=滑盖遮镜头 */
.dev-body .cam-module{position:absolute;top:17px;left:50%;transform:translateX(-50%);
  width:57%;height:44px;border-radius:99px;background:#0B0D0C;
  box-shadow:inset 0 1px 3px rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.25)}
.dev-body .cam-module .lens{position:absolute;left:8px;top:50%;transform:translateY(-50%);
  width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#3a4145,#101315 58%,#000);
  box-shadow:inset 0 0 0 2.5px #232a2d}
.dev-body .cam-module .lens::after{content:"";position:absolute;left:8px;top:6px;width:7px;height:7px;
  border-radius:50%;background:rgba(255,255,255,.35)}
.dev-body .cam-module .knob{position:absolute;right:5px;top:5px;width:64px;height:34px;border-radius:17px;
  background:#EE6A1F;border:1px solid #D95B12;box-shadow:0 1px 3px rgba(0,0,0,.35);
  transition:right .2s,left .2s,background .2s}
.dev-body .cam-module.closed .knob{left:5px;right:auto;background:#c9560f}
.dev-body .cam-module.closed .lens{background:radial-gradient(circle at 38% 34%,#4a5054,#20262a 58%,#0a0c0d)}
.dev-foot{display:flex;align-items:center;justify-content:center;margin-top:64px}
.dev-foot .hb{width:56px;height:56px;border-radius:50%;background:#fdfdfd;
  border:2.5px solid #c9cdd3;box-shadow:0 2px 5px rgba(0,0,0,.18),inset 0 1px 2px #fff}

/* 圆屏 */
.disp-round{
  position:relative;width:250px;height:250px;border-radius:50%;overflow:hidden;
  border:1px solid #000;background:var(--dev-bg);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.05), 0 10px 26px rgba(0,0,0,.45);
}
.disp-round::after{content:"";position:absolute;inset:20px;border-radius:50%;
  box-shadow:0 0 0 1px rgba(255,255,255,.07) inset;pointer-events:none}
.disp-round .safe{
  position:absolute;inset:20px;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;color:var(--dev-ink);text-align:center;
}
.disp-round .num{display:flex;align-items:baseline;gap:3px;line-height:1;font-weight:900;letter-spacing:-2px}
.disp-round .num b{font-size:56px}
.disp-round .num small{font-size:15px;font-weight:750;opacity:.62}
.disp-round .cap{font-size:12.5px;font-weight:750;letter-spacing:.8px;opacity:.82}
.disp-round .micro{font-size:11px;opacity:.6;letter-spacing:.6px}
/* 圆屏内进度环 */
.devring{--p:60;--sz:132px;width:var(--sz);height:var(--sz);border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--dev-brand,var(--brand)) calc(var(--p) * 1%), var(--dev-track) 0)}
.devring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--dev-bg)}
.devring .in{position:relative;line-height:1;display:flex;align-items:baseline;gap:2px}
.devring .in b{font-size:48px;font-weight:900;letter-spacing:-2px;color:var(--dev-ink)}
.devring .in small{font-size:13px;color:var(--dev-ink);opacity:.6}
.dispbar{width:74%;height:7px;border-radius:99px;background:var(--dev-track);overflow:hidden}
.dispbar i{display:block;height:100%;width:var(--p,60%);background:var(--dev-brand,var(--brand));border-radius:99px}
.eyes2{display:flex;gap:34px}
.eyes2 i{width:19px;height:52px;border-radius:14px;background:var(--dev-ink);box-shadow:0 0 20px rgba(255,255,255,.5)}
.disp-note{font-size:10.5px;opacity:.62;letter-spacing:.5px}

/* ══════════════════════════════════════════════════════════════
   5 · 令牌表 & 来源
   ══════════════════════════════════════════════════════════════ */
.tokgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin:12px 0 4px}
.tokcard{border:1px solid var(--bd-line);border-radius:13px;padding:14px 15px;background:var(--bd-panel2)}
.tokcard .ttl{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:750;margin-bottom:10px}
.tokcard .ttl i{width:22px;height:22px;border-radius:7px;flex:none;border:1px solid rgba(255,255,255,.18)}
.tokcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.tokcard dt{color:var(--bd-muted)}
.tokcard dd{margin:0;color:var(--bd-ink);font-family:"SF Mono",Consolas,monospace}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rule{border:1px solid var(--bd-line);border-radius:13px;padding:14px 16px;background:var(--bd-panel2)}
.rule b{display:block;font-size:13.5px;margin-bottom:5px}
.rule p{margin:0;font-size:12.5px;color:var(--bd-muted);line-height:1.7}
.hl{color:var(--bd-accent);font-weight:700}
.mini{font-size:12.5px;color:var(--bd-muted)}
.mt{margin-top:14px}

@media (max-width:1100px){
  .lede h1{font-size:30px}
  :root{--phone-zoom:.52}
}
/* ══════════════════════════════════════════════════════════════
   3b · 运动态专用令牌（同一方向里，手机端与设备端共用一套）
   ══════════════════════════════════════════════════════════════ */
[data-skin="clear"]    {--run-bg:#0E1210;--run-ink:#fff;--run-num:#fff;--run-brand:#A6E22E;--run-track:#2C332E;--run-core:#0E1210;--run-cap:#fff}
[data-skin="clear-d2"] {--run-bg:#0A0D0B;--run-ink:#fff;--run-num:#fff;--run-brand:#C6FF45;--run-track:#2C332E;--run-core:#0A0D0B;--run-cap:#fff}
[data-skin="clear-d3"] {--run-bg:#111511;--run-ink:#fff;--run-num:#fff;--run-brand:#7FB43A;--run-track:#2A302B;--run-core:#111511;--run-cap:#fff}
[data-skin="warm"]     {--run-bg:linear-gradient(168deg,#EFE9FC,#FCF7EE);--run-ink:#2E2A3D;--run-num:#6C5CE0;--run-brand:#6C5CE0;--run-track:#E2DAF6;--run-core:#F7F3FE;--run-cap:#837C96}
[data-skin="warm-d2"]  {--run-bg:linear-gradient(168deg,#F3EFFC,#FCFAFF);--run-ink:#2A2739;--run-num:#6C5CE0;--run-brand:#6C5CE0;--run-track:#E7E3F4;--run-core:#FFFFFF;--run-cap:#7E7B8E}
[data-skin="warm-d3"]  {--run-bg:linear-gradient(168deg,#F6EBDC,#FCF7F0);--run-ink:#2F2C27;--run-num:#B75535;--run-brand:#B75535;--run-track:#E9DDC9;--run-core:#FFFDF9;--run-cap:#857C6E}
[data-skin="arena"]    {--run-bg:#0FC3A8;--run-ink:#fff;--run-num:#fff;--run-brand:#fff;--run-track:rgba(255,255,255,.32);--run-core:#0FC3A8;--run-cap:rgba(255,255,255,.8)}
[data-skin="arena-d2"] {--run-bg:#BDF52D;--run-ink:#111816;--run-num:#111816;--run-brand:#111816;--run-track:rgba(17,24,22,.22);--run-core:#BDF52D;--run-cap:rgba(17,24,22,.72)}
[data-skin="arena-d3"] {--run-bg:#0FC3A8;--run-ink:#fff;--run-num:#fff;--run-brand:#fff;--run-track:rgba(255,255,255,.32);--run-core:#0FC3A8;--run-cap:rgba(255,255,255,.8)}

.run{flex:1;min-height:0;position:relative;padding-top:52px;display:flex;flex-direction:column;background:var(--run-bg);color:var(--run-ink)}
.run .ring{background:conic-gradient(var(--run-brand) calc(var(--p) * 1%), var(--run-track) 0)}
.run .ring::before{background:var(--run-core)}
.run .ring-in b{color:var(--run-num)}
.run .ring-in small{color:var(--run-ink);opacity:.55}
.run .bigcount{color:var(--run-num)}

[data-skin="arena-d3"] .disp-round,[data-skin="arena-d3"] .disp-rect{--dev-brand:#FFFFFF;--dev-track:rgba(255,255,255,.3);--dev-bg:#0B3F38}

.mv-advice-label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}
/* ══════════════════════════════════════════════════════════════
   L · 设计语言动效层 —— 纯 CSS 模拟 GSAP 模式（零依赖，离线可用）
   lg-up = SplitText 式入场揭示 · lg-pop = elastic.out 式弹性
   lg-marq = marquee(translateX -50%) 线性循环 · lg-grow = 条形展开
   lg-breathe = 角色待机呼吸；prefers-reduced-motion 全部关闭
   ══════════════════════════════════════════════════════════════ */
@keyframes lg-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes lg-pop{0%{opacity:0;transform:scale(.86)}62%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes lg-marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes lg-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes lg-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lg-in>*{animation:lg-up .55s cubic-bezier(.22,1,.36,1) both}
.lg-in>*:nth-child(1){animation-delay:.03s}
.lg-in>*:nth-child(2){animation-delay:.09s}
.lg-in>*:nth-child(3){animation-delay:.15s}
.lg-in>*:nth-child(4){animation-delay:.21s}
.lg-in>*:nth-child(5){animation-delay:.27s}
.lg-in>*:nth-child(6){animation-delay:.33s}
.lg-in>*:nth-child(7){animation-delay:.39s}
.lg-in>*:nth-child(8){animation-delay:.45s}
.lg-in>*:nth-child(9){animation-delay:.51s}
.lg-in>*:nth-child(10){animation-delay:.57s}
.lg-in>*:nth-child(11){animation-delay:.62s}
.lg-in>*:nth-child(12){animation-delay:.66s}
.lg-pop{animation:lg-pop .6s cubic-bezier(.34,1.56,.64,1) both}
@media (prefers-reduced-motion:reduce){
  .lg-in>*,.lg-pop,.cl-float{animation:none!important}
  .kp-marq>div{animation:none!important}
  .eb-bar i,.cl-bar i{transform:none!important}
}

/* ── L1 · 方向一 = Editorial Bento（Awwwards 编辑排版 / Bento Grids / Linear 式）
      语法：异尺寸便当格 + 1px 发丝线 + 特大等宽数字 + 墨色块强调 + 克制入场 ── */
.eb{font-size:13px;color:var(--ink)}
.eb-page{padding:6px 16px 74px}
.eb-kick{font-size:9.5px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.eb-kick::after{content:"";flex:1;height:1px;background:var(--line)}
.eb-kick b{color:var(--brand);font-weight:800}
.eb-h1{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.12;margin:8px 0 3px}
.eb-sub{font-size:11.5px;color:var(--muted)}
.eb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.eb-cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 14px;box-shadow:var(--shadow)}
.eb-cell.w2{grid-column:span 2}
.eb-cell.tint{background:var(--surface2)}
.eb-cell.ink{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.eb-cell.ink .eb-sub{color:color-mix(in srgb,var(--accent-ink) 72%,transparent)}
.eb-num{font-size:34px;font-weight:800;letter-spacing:-1.6px;line-height:1;font-variant-numeric:tabular-nums}
.eb-num small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.eb-lbl{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.eb-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.eb-row b{font-size:13.5px;font-weight:750;display:block;letter-spacing:-.1px}
.eb-row .eb-sub{display:block;margin-top:2px}
.eb-idx{font-size:11px;font-weight:800;color:var(--brand);width:24px;flex:none;font-variant-numeric:tabular-nums}
.eb-tag{margin-left:auto;font-size:10px;font-weight:750;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);white-space:nowrap;flex:none}
.eb-tag.on{background:var(--brand);color:var(--brand-ink)}
.eb-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:14.5px;width:100%}
.eb-btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.eb-tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-top:12px}
.eb-tabs span{padding:9px 2px 10px;font-size:12.5px;font-weight:750;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.eb-tabs span.on{color:var(--ink);border-color:var(--ink)}
.eb-bar{height:5px;border-radius:99px;background:var(--track);overflow:hidden}
.eb-bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transform-origin:0 50%;animation:lg-grow .9s cubic-bezier(.22,1,.36,1) .25s both}
.eb-score{font-size:54px;font-weight:800;letter-spacing:-2.5px;line-height:1;font-variant-numeric:tabular-nums}
.eb-spec{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:9px 0;border-top:1px solid var(--line)}
.eb-spec span{color:var(--muted)}
.eb-spec b{font-weight:750;font-variant-numeric:tabular-nums}

/* ── L2 · 方向二 = Claymorphism（Behance 粘土拟物）
      语法：双重阴影粘土卡（外投影 + inset 左上高光 + inset 右下暗影）
      + 2.5px 厚边框 + 弹性缓动 cubic-bezier(.34,1.56,.64,1) + 按压 squash + 角色呼吸 ── */
.cl{font-size:13px;color:var(--ink)}
.cl-page{padding:8px 16px 78px}
.cl-kick{font-size:10px;font-weight:800;letter-spacing:1.8px;color:var(--muted)}
.cl-h1{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin:6px 0 3px}
.cl-h1 em{font-style:normal;color:var(--brand)}
.cl-sub{font-size:11px;color:var(--muted);font-weight:600}
.cl-clay{background:var(--surface);border:2.5px solid color-mix(in srgb,var(--brand) 24%,var(--line));border-radius:24px;padding:14px;
  box-shadow:0 10px 20px color-mix(in srgb,var(--brand) 16%,transparent),
    inset 0 3px 0 rgba(255,255,255,.75),
    inset 0 -4px 8px color-mix(in srgb,var(--ink) 7%,transparent)}
.cl-clay.tint{background:var(--surface2)}
.cl-clay.brand{background:var(--brand);color:var(--brand-ink);border-color:color-mix(in srgb,var(--brand) 62%,#000)}
.cl-clay.brand .cl-sub{color:color-mix(in srgb,var(--brand-ink) 82%,transparent)}
.cl-chip{display:inline-flex;align-items:center;padding:6px 11px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-size:11px;font-weight:750;white-space:nowrap;box-shadow:inset 0 2px 0 rgba(255,255,255,.65)}
.cl-ico{width:42px;height:42px;border-radius:15px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:17px;font-weight:900;flex:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -4px 6px rgba(0,0,0,.14),0 5px 10px color-mix(in srgb,var(--brand) 30%,transparent)}
.cl-ico.alt{background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 6px rgba(0,0,0,.16),0 5px 10px color-mix(in srgb,var(--accent) 28%,transparent)}
.cl-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;width:100%;border-radius:99px;background:var(--brand);color:var(--brand-ink);font-size:15px;font-weight:800;
  box-shadow:0 9px 18px color-mix(in srgb,var(--brand) 38%,transparent),inset 0 3px 0 rgba(255,255,255,.4),inset 0 -5px 8px rgba(0,0,0,.12);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1)}

/* 状态栏 / home 指示条颜色：底色深则用白，底色浅则用墨 */
function chrome(skin, screen){
  const BLANK = {sb:'#0E1512', bar:'rgba(0,0,0,.7)'};      /* 浅底 → 墨色 */
  const ONC   = {sb:'#FFFFFF', bar:'rgba(255,255,255,.86)'}; /* 深底 → 白色 */
  if(skin==='clear-d2') return ONC;   /* 墨底仪表：状态栏转白 */
  return BLANK;
}
function phone(model, skin, dir, screen, mod){
  const ch = chrome(skin, screen);
  const M = MODELS.find(x=>x.id===model) || MODELS[0];
  const nt = M.chrome;
  const notchEl = nt==='刘海' ? '<div class="notch"></div>'
                : nt==='挖孔' ? '<div class="punch"></div>'
                : '<div class="island"></div>';
  return `<div class="phone" data-model="${model}" data-notch="${nt}" data-skin="${skin}">
    <div class="screen">
      ${notchEl}
      <div class="statusbar" style="color:${ch.sb}"><span>9:41</span><span class="r">${I.sig}${I.wifi}${I.batt}</span></div>
      ${screenHTML(skin, dir, screen, mod)}
      <div class="homebar" style="background:${ch.bar}"></div>
    </div>
    <span class="btn-r"></span>
  </div>`;
}

/* 温暖陪伴屋（warm）与 活力运动场（arena）两方向于 2026-10-09 按用户决定移除：
   手机端页面已统一为 V1.1 中性系统风，切方向无可感知差异；其构建器与皮肤令牌仍保留，
   后续如需恢复多方向比较可重新加入 DIRS。 */
];

/* ══════════════ 组装看板 ══════════════ */
let lastRenderedPage=null;
let STATE = {model:'ip15p', zoom:'fit', direction:'clear', version:0, page:'home', shape:'round', deviceState:'idle'};

function strip(model, skin, dir, mod, caps){
  return `<div class="strip">${caps.map(c=>slot(model,skin,dir,c.sc,mod,c)).join('')}</div>`;
}
function dirSection(d){
  const m = STATE.model;
  const scr = ['home','tasks','device','analysis'];
  const capSets = v => scr.map(s=>({sc:s, t:CAPS[s].t, s:CAPS[s].s, h:CAPS[s].h}));

  const rows = [`
    <div style="display:flex;align-items:center;gap:10px;margin:26px 0 0">
      <span class="badge-v restore">还原</span><b style="font-size:14px">${d.restore.cap}</b>
      <span class="mini">${d.restore.note}</span>
    </div>
    ${strip(m, d.restore.skin, d.k, null, capSets(d.restore))}`,
    ...d.variants.map(v=>`
    <div style="display:flex;align-items:center;gap:10px;margin:30px 0 0">
      <span class="badge-v diverge">${v.tag}</span><b style="font-size:14px">${v.cap}</b>
      <span class="mini">${v.note}</span>
    </div>
    ${strip(m, v.skin, d.k, v.mod, capSets(v))}`)
  ].join('');

  const devRows = [`
    <h3 style="margin:34px 0 6px;font-size:15px">设备端 · 与手机端同一套令牌</h3>
    <p class="mini" style="margin:0 0 14px">圆屏 1.8″ 360×360（ST77916，内切安全区 20px）。三态：待机 / 运动中 / 完成。</p>
    <div class="dev-row">
      ${devUnit('圆屏 1.8″',''+d.k, d.k,'round','idle','待机 · 双眼前后一致','')}
      ${devUnit('圆屏 1.8″',''+d.k, d.k,'round','run','运动中 · 12/20 · 环形进度','')}
      ${devUnit('圆屏 1.8″',''+d.k, d.k,'round','done','完成 · 20/20','')}
    </div>`
  ].join('');

  return `<section class="dir" id="dir-${d.k}">
    <div class="dir-head">
      <div class="dir-no">${d.no}</div>
      <div>
        <h2>${d.name} <span style="font-size:14px;color:var(--bd-muted);font-weight:500">${d.en}</span></h2>
        <p class="sub">${d.desc}</p>
        <p class="sub" style="color:#6f7d8c"><span class="hl">取舍</span> ${d.why}</p>
      </div>
      <div class="src"><span class="tag">${d.from}</span> <span class="tag" style="color:var(--bd-accent);border-color:color-mix(in srgb,var(--bd-accent) 55%,transparent)">${d.lang}</span><br>四屏同数据 · 深蹲起 15 次 · 得分 86 · 有效 13/15</div>
    </div>
    ${rows}
    ${devRows}
    <div class="panel" style="margin-top:26px">
      <h3 style="margin-top:0">令牌对照 · ${d.name}</h3>
      <table><thead><tr><th>版本</th><th>背景</th><th>正文</th><th>品牌色</th><th>卡片</th><th>圆角 大/中/小</th><th>设备底</th></tr></thead><tbody>
      ${d.tokens.map(t=>`<tr><td><b>${t[0]}</b></td>
        <td><span class="sw"><i style="background:${t[1]}"></i>${t[1]}</span></td>
        <td><span class="sw"><i style="background:${t[2]}"></i>${t[2]}</span></td>
        <td><span class="sw"><i style="background:${t[3]}"></i>${t[3]}</span></td>
        <td><span class="sw"><i style="background:${t[4]}"></i>${t[4]}</span></td>
        <td>${t[5]}</td>
        <td><span class="sw"><i style="background:${t[6]}"></i>${t[6]}</span></td></tr>`).join('')}
      </tbody></table>
    </div>
  </section>`;
}

function render(){
  if(typeof MOBILE_ONLY!=="undefined"&&MOBILE_ONLY){renderMobile();return;}
  const q=flow.getState().session; P=q?Math.round(q.count/q.target*100):0;
  document.documentElement.style.setProperty('--phone-zoom', STATE.zoom==='full' ? '1' : '.62');
  const d=DIRS.find(x=>x.k===STATE.direction)||DIRS[0];
  const versions=[{...d.restore,label:'基础版'},...d.variants.map(v=>({...v,label:v.cap}))];
  const v=versions[STATE.version]||versions[0];
  const cap=CAPS[STATE.page]||{t:({ai:'AI运动助手',growth:'成长',mine:'我的',library:'动作库',records:'运动记录',posture:'姿态提醒',profile:'孩子资料'})[STATE.page]||STATE.page};
  const app=document.getElementById('app');
  const choices=(key,items)=>items.map(([value,label])=>`<button type="button" data-control="${key}" data-value="${value}" aria-pressed="${String(STATE[key])===String(value)}">${label}</button>`).join('');
  const shapeName='圆屏候选';
  const currentFlow=flow.getState();
  const deviceName=STATE.deviceState==='idle'?'待机':`${currentFlow.session?.status==='paused'?'已暂停':STATE.deviceState==='done'?(D.current>=D.target?'完成':'提前结束'):'运动中'} · ${D.current}/${D.target}`;
  const oldScroller=app.querySelector('.sc-scroll');
  const previousScroll=lastRenderedPage===STATE.page&&oldScroller?oldScroller.scrollTop:0;
  app.innerHTML=`
    <header class="board-top"><div class="in"><div class="brand"><b>Teamo · UI 风格实验室</b><span>同一展示区 · 切换方案比较</span></div><span class="lab-static">可点击前端演示 · 设备与网络由本地模拟</span></div></header>
    <main class="lab-wrap">
      <div class="lab-title"><div><h1>切换皮肤，比较同一页</h1><p>选择方向与皮肤后，当前页面、机型和设备状态保持不变。</p></div><span class="tag">2026-10-09 · 紧凑评审版</span></div>
      <nav class="lab-controls" aria-label="设计预览控制">
        <div class="control-row"><span>方向</span><div class="seg" role="group" aria-label="设计方向">${choices('direction',DIRS.map(x=>[x.k,x.name]))}</div><span>皮肤</span><div class="seg" role="group" aria-label="当前方向的皮肤">${choices('version',versions.map((x,i)=>[i,x.label]))}</div></div>
        <div class="control-row"><span>页面</span><div class="seg" role="group" aria-label="手机页面">${choices('page',[['home','首页'],['tasks','任务'],['ai','AI'],['growth','成长'],['mine','我的']])}</div><div class="seg" role="group" aria-label="预览缩放">${choices('zoom',[['fit','适配'],['full','1:1']])}</div></div>
      </nav>
      <div class="preview-stage" aria-label="当前方案预览">
        <section class="preview-side" aria-label="手机预览"><h2><span>家长端 · ${cap.t}</span><span class="model-pick"><label for="lab-model">机型</label><select id="lab-model" data-select="model">${MODELS.map(x=>`<option value="${x.id}" ${x.id===STATE.model?'selected':''}>${x.name}</option>`).join('')}</select></span></h2><div class="stage-phone">${phone(STATE.model,v.skin,d.k,STATE.page,v.mod)}</div><p class="lab-caption">${v.label} · ${cap.s||''}<br>${cap.h||'示例数据用于比较布局，不是算法验收结果。'}</p></section>
        <section class="preview-side" aria-label="设备预览"><h2>设备端 · ${shapeName}</h2><div class="control-row"><div class="seg" role="group" aria-label="设备显示状态">${flow.getState().session?`<span class="tag">${flow.getState().session.status==='paused'?'已暂停':deviceName}</span>`:`<span class="tag">待机</span>`}</div></div><div class="stage-device">${devUnit(shapeName,v.skin,d.k,'round',STATE.deviceState,deviceName,'')}</div>${typeof devicePanel==='function'?devicePanel():''}<p class="lab-caption">${deviceName} · 设备沿用现有深色候选。<br>屏幕仍是候选；完成状态跟随手机运动会话。</p></section>
      </div>
      <details class="lab-details"><summary>当前方向的设计说明与令牌</summary><p><b>${d.lang}</b> · ${v.note||d.restore.note}</p><p>手机端预览共用小程序 MVP 的功能、导航与布局；切换皮肤只比较视觉样式（当前仅保留「清晰成长」方向，其余两方向已按评审决定移除）。设备和记录从手机内的二级入口访问。</p><div class="table-scroll"><table><thead><tr><th>版本</th><th>背景</th><th>正文</th><th>品牌色</th><th>卡片</th><th>圆角</th><th>设备底</th></tr></thead><tbody>${d.tokens.map(t=>`<tr>${t.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>
      <details class="lab-details"><summary>参考依据、评审建议与使用边界</summary><p><a href="../../docs/product/design/ui-reference-trace-20261008/参考到UI的对应关系_V0.2.md">真实参考 → 特征 → 转译 → 四屏方案</a> · <a href="index-long-board-archive-20261009.html">旧长看板归档</a></p><ul><li>本页是布局与风格预览。示例得分、有效次数和建议不代表真实算法能力。</li><li>方向接受度、低龄适用性与远距可读性是待验证假设，不凭视觉稿作排名。</li><li>家长端需要区分发送中、后台受理与设备确认；结果区分完成、已保存与已同步。</li><li>运动中装饰动效应停止；暂停操作应固定且易找。手机交互由共享 flow-core 驱动，后续替换命令与设备适配器。</li><li>圆屏安全区需依真实屏幕几何与实机校准，不能把示意参数当作冻结规格。</li><li>通用画廊和检索页只是线索，最终视觉评审应保留具体作品、作者与实际截图。</li></ul><p>本轮复用三方向字体、色彩与控件样式；业务视图统一消费共享状态。原静态页面保留在归档文件，不代表所有远期功能已实现。</p></details>
      <button type="button" class="flow-reset" data-flow="reset">重置演示数据</button>
    </main>`;
  const newScroller=app.querySelector('.sc-scroll');if(newScroller)newScroller.scrollTop=previousScroll;
  lastRenderedPage=STATE.page;
  bindFlow();
  if(typeof bindDevice==='function')bindDevice();
  app.querySelectorAll('[data-control]').forEach(b=>b.addEventListener('click',()=>{
    const key=b.dataset.control;
    STATE[key]=key==='version'?Number(b.dataset.value):b.dataset.value;
    if(key==='direction')STATE.version=0;
    const focusKey=key,focusValue=String(STATE[key]);
    render();
    const next=app.querySelector(`[data-control="${focusKey}"][data-value="${focusValue}"]`);
    if(next)next.focus({preventScroll:true});
  }));
  app.querySelectorAll('[data-select]').forEach(el=>el.addEventListener('change',()=>{
    STATE[el.dataset.select]=el.value;render();
    const next=app.querySelector(`[data-select="${el.dataset.select}"]`);if(next)next.focus({preventScroll:true});
  }));
}

</script>
<script src="mvp-templates.js"></script>
<script src="flow-ui.js"></script>
<script src="device-ui.js"></script>
<script>render();</script>
</body>
</html>
