<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1110" style="color-scheme:light dark;background:Canvas;color:CanvasText;font-family:system-ui"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="CanvasText"/></marker></defs><g fill="CanvasText"><rect x="590" y="460" width="270" height="100" rx="10" fill="Canvas" stroke="CanvasText"/><text x="725" y="500" text-anchor="middle" font-size="23">Teamo设备端UE</text><text x="725" y="531" text-anchor="middle" font-size="15">操作 → 提示 → 需求 → 验证</text><path d="M590 510H530V125H480" fill="none" stroke="CanvasText"/><rect x="30" y="30" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="50" y="65" font-size="21">1. 入口与任务</text><text x="50" y="102" font-size="16">首页表情 · idle</text><text x="50" y="132" font-size="16">自主运动 · select / target</text><text x="50" y="162" font-size="16">家长任务 · task_arrive / task_alert</text><text x="50" y="192" font-size="16">待办 · todo；新任务不抢占运动</text><path d="M590 510H530V390H480" fill="none" stroke="CanvasText"/><rect x="30" y="295" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="50" y="330" font-size="21">2. 站好与开始</text><text x="50" y="367" font-size="16">站位 → 准备 → 倒计时</text><text x="50" y="397" font-size="16">方向图标 + 短语音（待定）</text><text x="50" y="427" font-size="16">相机看得到伸开的手脚</text><text x="50" y="457" font-size="16">开始方式 / 稳定时间待测</text><path d="M590 510H530V655H480" fill="none" stroke="CanvasText"/><rect x="30" y="560" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="50" y="595" font-size="21">3. 运动与反馈</text><text x="50" y="632" font-size="16">运动 · running；实际 / 目标</text><text x="50" y="662" font-size="16">次数与有效秒数分开</text><text x="50" y="692" font-size="16">完整动作才加一，不重复</text><text x="50" y="722" font-size="16">设备本地识别；算力与散热实测</text><path d="M590 510H530V920H480" fill="none" stroke="CanvasText"/><rect x="30" y="825" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="50" y="860" font-size="21">4. 暂停与保护</text><text x="50" y="897" font-size="16">暂停 / 离画 · pause / away</text><text x="50" y="927" font-size="16">保留成绩，重查站位后恢复</text><text x="50" y="957" font-size="16">隐私关闭 · privacy：停采集</text><text x="50" y="987" font-size="16">远距暂停 / 继续方式待确认</text><path d="M860 510H920V125H970" fill="none" stroke="CanvasText"/><rect x="970" y="30" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="990" y="65" font-size="21">5. 保存与家长结果</text><text x="990" y="102" font-size="16">本地保存 + 待上传记录（补齐）</text><text x="990" y="132" font-size="16">掉电 / 存储满 / 保存失败验证</text><text x="990" y="162" font-size="16">网络恢复补传；重传只记一次</text><text x="990" y="192" font-size="16">celebrate / result：真实成绩与同步状态</text><path d="M860 510H920V390H970" fill="none" stroke="CanvasText"/><rect x="970" y="295" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="990" y="330" font-size="21">6. 已有扩展场景</text><text x="990" y="367" font-size="16">计划 · plan / plan_alert</text><text x="990" y="397" font-size="16">逐项 / 休息 · plan_step / plan_rest</text><text x="990" y="427" font-size="16">体态 · posture / posture_active</text><text x="990" y="457" font-size="16">学校任务 / rank：本次范围待确认</text><path d="M860 510H920V655H970" fill="none" stroke="CanvasText"/><rect x="970" y="560" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="990" y="595" font-size="21">7. 软件要做到什么</text><text x="990" y="632" font-size="16">任务与儿童身份对应</text><text x="990" y="662" font-size="16">准备、计数、暂停规则完整</text><text x="990" y="692" font-size="16">声音与显示不互相抢占</text><text x="990" y="722" font-size="16">离线识别、可靠保存、真实回执</text><path d="M860 510H920V920H970" fill="none" stroke="CanvasText"/><rect x="970" y="825" width="450" height="200" rx="8" fill="Canvas" stroke="CanvasText"/><text x="990" y="860" font-size="21">8. 硬件与待决定事项</text><text x="990" y="897" font-size="16">屏幕 / 按键 / 扬声器</text><text x="990" y="927" font-size="16">相机视场角、摆放与隐私检测</text><text x="990" y="957" font-size="16">主控 / 内存 / 存储 / 散热</text><text x="990" y="987" font-size="16">动作、阈值、媒体和11/15范围待确认</text></g></svg>