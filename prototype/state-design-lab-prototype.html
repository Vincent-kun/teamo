<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运动伙伴 · 全软件可视化设计</title>
<style>
:root{--ink:#2f293e;--muted:#746b83;--purple:#7045b3;--wash:#efe7fb;--line:#e3dbea;--bg:#faf8fc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 32px 16px;background:white;border-bottom:1px solid var(--line)}h1{font-size:27px;margin:4px 0}h2{font-size:22px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0}small,.muted{color:var(--muted)}.eyebrow{font-size:12px;color:var(--purple);letter-spacing:1px}.tag{display:inline-block;font-size:12px;background:var(--wash);color:var(--purple);padding:3px 8px;border-radius:6px}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);padding:8px 13px;border-radius:9px}button.active,button:hover{background:var(--wash);color:var(--purple);border-color:var(--purple)}button.primary{background:var(--purple);color:white}button:disabled{opacity:.4;cursor:default}nav{display:flex;gap:10px;padding:12px 32px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}main{max-width:1550px;margin:auto;padding:25px 30px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}.notice{padding:15px;background:#fff5e7;color:#845c2c;border-radius:9px;margin:14px 0}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}.phone{border:6px solid #342c42;border-radius:26px;background:#faf8fd;padding:22px;max-width:340px;margin:auto;min-height:330px}.device{width:240px;height:240px;border:12px solid #dcd7e4;background:#2e263b;color:white;border-radius:50%;margin:20px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.device b{font-size:48px}.metric{font-size:32px;color:var(--purple)}.trace-step{padding:11px;border-bottom:1px solid var(--line);display:flex;gap:15px;align-items:center}.trace-step.current{ <header><div class="eyebrow">SPORTMATE / 完整设计框架 / 作图方法修订 V0.2</div><h1>看清一条主线，再展开细节</h1><p class="muted">泳道看协作，能力树看范围，架构看职责，状态图看变化。候选设计 · 11/15范围由PM决定 · 图稿与情境均为设计模拟。</p></header><nav id="tabs"></nav><main id="app"></main>
<script>
let view='atlas',domain='session',node=0,decisions={},storyIndex=0,storyStep=0;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(text,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${text}</button>`}
function changeView(v){view=v;render()}
function render(){for(const d of domains)if(!decisions[d.id])decisions[d.id]={scope:'待PM决定',owner:'待指派',note:''};$('tabs').innerHTML=[['atlas','01 完整图谱'],['play','02 情境推演'],['methods','03 作图依据'],['scope','04 PM范围']].map(([id,n])=>btn(n,`changeView('${id}')`,view===id?'active':'')).join('');$('app').innerHTML=({atlas,play,methods,scope})[view]();}
const scene=(title,why,steps)=>({title,why,steps});
const stories=[
scene('正常运动闭环','区分设备收到、儿童开始、结果保存与同步确认。',[['家长创建任务','待机',0,'发送中','无结果','家长设置动作与目标，后台校验并下发。'],['设备收到任务','待机',0,'已送达','无结果','回执证明收到，不代表孩子已开始。'],['儿童开始并入镜','准备',0,'执行中','无结果','相机物理开启且授权有效，全身稳定入镜。'],['倒计时结束','运动中',0,'执行中','无结果','开始运动，识别以完整动作事件计数。'],['完成目标','结果待保存',20,'执行中','无结果','20是演示目标，不是儿童训练建议。'],['本地保存成功','结果',20,'已完成','待上传','可靠保存后展示结果；队列仍保留。'],['收到上传确认','结果',20,'已完成','已同步','去重接收，设备清理已确认队列。']]),
scene('离画再回来','已有12次确认进度，离画暂停后不能清零或补造次数。',[['已确认12次','运动中',12,'执行中','无结果','设备会话拥有计数真源。'],['儿童离画','暂停',12,'执行中','无结果','清除半个动作周期，保留已确认12次。'],['尝试直接继续','暂停',12,'执行中','无结果','被阻止：先重新入镜。'],['重新入镜并确认','运动中',12,'执行中','无结果','由儿童确认继续，重新开始完整周期。'],['下一个有效动作','运动中',13,'执行中','无结果','下一次为13，不是1或14。']]),
scene('断网后的结果补传','设备本地运动继续，家长最后确认信息不冒充实时。',[['网络断开','运动中',12,'执行中','无结果','家长显示最后确认12次，离线状态明确。'],['本地继续并结束','结果待保存',15,'未达标','无结果','提前结束保存真实15/20，不标达标。'],['本地保存','结果',15,'未达标','待上传','结果不丢，等待连接恢复。'],['连接恢复','结果',15,'未达标','待确认','同步权威快照、上传同一会话。'],['确认到达','结果',15,'未达标','已同步','确认前不清队列，重复接收不重复奖励。']]),
scene('摄像头或授权关闭','隐私条件优先于开始和继续命令。',[['运动中','运动中',12,'执行中','无结果','相机工作状态对家长与孩子可理解。'],['物理关闭摄像头','暂停',12,'执行中','无结果','停止采集，不删除已有进度。'],['请求继续','暂停',12,'执行中','无结果','被阻止：物理状态不允许采集。'],['开启且重新入镜','暂停',12,'执行中','无结果','仍需家长授权有效与儿童确认。'],['儿童确认继续','运动中',12,'执行中','无结果','恢复后下一完整动作才计数。']]),
scene('保存失败再重试','不能把待保存结果显示为已可靠保存。',[['提前结束','结果待保存',12,'未达标','无结果','保留真实努力。'],['本地写入失败','保存失败',12,'未达标','未保存','显示失败与重试，不提前发完成记录。'],['存储恢复并重试','结果',12,'未达标','待上传','同一会话只形成一条记录。'],['上传确认','结果',12,'未达标','已同步','保存与同步分成两个步骤。']]),
scene('设备重启恢复','这是恢复策略讨论，不是断电持久化验收。',[['已有确认进度','运动中',12,'执行中','无结果','持久化检查点由技术评审确定。'],['设备异常重启','中断',12,'执行中','无结果','不补计半动作，不标虚假完成。'],['恢复并重新入镜','暂停',12,'执行中','无结果','保留最后可靠进度，明确恢复提示。'],['儿童确认继续','运动中',12,'执行中','无结果','真实实现需验证存储事务与恢复。']]),
scene('删除后的旧缓存','删除传播到结果、队列与分析，防止旧数据复活。',[['已有本地结果','结果',12,'未达标','待上传','同一结果尚未同步。'],['家长授权删除','结果',12,'未达标','已删除','清结果队列分析，并保留删除版本。'],['旧设备尝试补传','结果',12,'未达标','已删除','删除墓碑阻止复活；真实协议须验证。']]),
scene('分析超时不挡运动','分析独立授权，不能改变次数或完成状态。',[['真实结果可用','结果',20,'已完成','已同步','只使用授权结构化摘要。'],['请求分析','结果',20,'已完成','已同步','分析中仍可发起下一次运动。'],['分析超时','结果',20,'已完成','已同步','降级展示事实摘要，不输出虚假精确评分。']])];
function chooseStory(i){storyIndex=i;storyStep=0;render()}
function nextStory(){storyStep=Math.min(stories[storyIndex].steps.length-1,storyStep+1);render()}
function play(){const sc=stories[storyIndex],s=sc.steps[storyStep];return `<h2>${sc.title}</h2><p class="muted">${sc.why}</p><div class="row"><label>情境 <select onchange="chooseStory(Number(this.value))">${stories.map((x,i)=>`<option value="${i}" ${i===storyIndex?'selected':''}>${x.title}</option>`).join('')}</select></label>${btn('上一步','storyStep=Math.max(0,storyStep-1);render()')}${btn('下一步','nextStory()','primary')}${btn('查看完整状态图',"selectDomain('session');view='atlas';render()")}</div><div class="two"><section class="panel"><h3>步骤与触发</h3>${sc.steps.map((x,i)=>`<div class="trace-step ${i===storyStep?'current':i<storyStep?'done':''}"><span class="number">${i+1}</span><button onclick="storyStep=${i};render()">${x[0]}</button></div>`).join('')}<p>${s[5]}</p></section><section class="panel"><h3>同一步骤，两个端如何理解？</h3><div class="two"><div class="phone"><small>家长端 · 情境示意</small><h3>当前任务</h3><p>任务：${s[3]}</p><p>同步：${s[4]}</p><p class="metric">${storyIndex===2&&storyStep<3?12:s[2]} / 20</p><p class="muted">${storyIndex===2&&storyStep<3?'设备离线，显示上次确认':'显示设备最近确认状态'}</p></div><div><div class="device"><small>${s[1]}</small><b>${s[2]}<small style="font-size:19px">/20</small></b><small>状态模拟</small></div><p class="muted">圆屏仅用于讨论，尺寸与输入方式待硬件确认。</p></div></div></section></div><div class="notice">这是预设情境推演，用于检查图与双端表达，不是实际算法、网络或存储实现。完整业务原型仍参考项目已有UE；此版本重点验证图形是否清楚。</div>`}
function methods(){return `<h2>为什么要拆成四种图？</h2><p class="muted">使用成熟语义与Graphviz分层布局；图不按序号硬塞九宫格。</p><div class="method-grid">${[['能力树','回答“包含哪些能力”','树枝表示包含关系，适合全量范围讨论；不把树枝画成状态转移。','https://mermaid.js.org/syntax/mindmap.html','Mermaid Mindmap'],['职责架构','回答“谁负责什么、数据到哪里”','明确边界、职责、单向关系与标签。当前是概念职责图，技术和部署待评审。','https://c4model.com/diagrams/notation','C4 Notation'],['运动泳道','回答“不同端怎样交接”','每一列是责任主体，每一行是阶段，按步骤阅读。是简化责任泳道，不宣称完整BPMN符号合规。','https://www.omg.org/spec/BPMN/2.0.2','OMG BPMN'],['局部状态','回答“事件后状态如何变化”','事件、条件、动作明确，网络/授权/运动分别建模；正常主链先展示，全部转移按需展开。','https://www.w3.org/TR/scxml/','W3C SCXML']].map(([a,b,c,url,label])=>`<section class="panel"><span class="tag">${a}</span><h3>${b}</h3><p>${c}</p><a href="${url}" target="_blank" rel="noopener">${label}</a></section>`).join('')}</div><section class="panel"><h3>作图与验证</h3><p>Graphviz dot按关系分层，并尝试减少交叉与边长。所有图预生成离线SVG；文字保持自然尺寸，通过滚动和缩放查看，不将巨图缩成不可读小字。</p><p><a href="https://graphviz.org/docs/layouts/dot/" target="_blank" rel="noopener">Graphviz dot</a> · <a href="https://c4model.com/diagrams/checklist" target="_blank" rel="noopener">C4复核清单</a> · <a href="https://eclipse.dev/elk/reference/algorithms/org-eclipse-elk-layered.html" target="_blank" rel="noopener">ELK Layered备选方法</a></p><p>本地静态布局检查包括节点重叠、文字边界与连线穿节点。实际浏览器交互、窄屏和你是否能快速理解，仍需评审。效果确认后才沉淀成技能。</p></section>`}
function setDecision(id,k,v){decisions[id][k]=v}
function scope(){return `<h2>完整框架保留，由PM标记本轮范围</h2><p class="muted">默认全部待决定。当前勾选不会删除设计图，只用于讨论11月15日交付。刷新会重置，请先导出。</p>${btn('导出范围表','exportScope()','primary')}<div class="panel tablewrap"><table><tr><th>能力</th><th>本轮决定</th><th>责任人</th><th>待评审问题</th></tr>${domains.filter(d=>d.id!=='overview').map(d=>`<tr><td>${d.title}</td><td><select onchange="setDecision('${d.id}','scope',this.value)">${['待PM决定','11/15展示必需','后续实施','设计保留暂不实施'].map(x=>`<option ${decisions[d.id].scope===x?'selected':''}>${x}</option>`).join('')}</select></td><td><input aria-label="${d.title}负责人" value="${esc(decisions[d.id].owner)}" onchange="setDecision('${d.id}','owner',this.value)"></td><td>${d.open}</td></tr>`).join('')}</table></div><h3>分轮出口</h3><p>第一轮检查完整图谱与情境；第二轮比较组织方式与2–3套简约视觉；第三轮完成可点击双端UI并按PM范围接真实实现；第四轮做实机与儿童家庭验证。各轮可重叠，范围未定处保持候选标记。</p>`}
function download(name,content,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportScope(){download('运动伙伴_PM范围讨论.json',JSON.stringify({date:'2026-10-08',deadline:'2026-11-15',status:'待PM确认',decisions},null,2))}

as-canvas{overflow:visible;max-height:none;border:0}.atlas-canvas svg{max-width:100%!important;width:100%!important}}</style><script>const domains=[{"id":"overview","title":"软件整体","owner":"跨端协作","states":[{"id":"overview0","name":"家长端","note":"任务与结果"},{"id":"overview1","name":"同步权限","note":"命令与授权"},{"id":"overview2","name":"设备通信","note":"快照与补传"},{"id":"overview3","name":"运动会话","note":"计数与恢复"},{"id":"overview4","name":"视觉隐私","note":"入镜与有效事件"},{"id":"overview5","name":"设备反馈","note":"数字与语音"},{"id":"overview6","name":"本地队列","note":"可靠保存"},{"id":"overview7","name":"成长分析","note":"真实记录摘要"},{"id":"overview8","name":"学校任务","note":"必要结果"}],"edges":[],"rule":"分别建模职责、主链与状态，图形不代替范围批准。","open":"PM决定11/15交付范围。"},{"id":"session","title":"运动主状态","owner":"设备会话模块","states":[{"id":"session0","name":"待机/选择","note":"任务或自主运动"},{"id":"session1","name":"入镜","note":"全身、距离与站位"},{"id":"session2","name":"准备","note":"稳定满足条件"},{"id":"session3","name":"倒计时","note":"离画可取消"},{"id":"session4","name":"运动中","note":"确认次数或有效秒数"},{"id":"session5","name":"暂停","note":"保留确认进度"},{"id":"session6","name":"结果待保存","note":"达标或提前结束"},{"id":"session7","name":"保存失败","note":"进度保留可重试"},{"id":"session8","name":"结果","note":"业务状态与同步分开"}],"edges":[[0,1,"儿童选择"],[1,2,"入镜稳定"],[2,3,"儿童确认"],[3,4,"倒计时结束"],[3,1,"离画"],[4,5,"暂停/离画"],[5,4,"重新入镜且确认"],[4,6,"达标/结束"],[5,6,"提前结束"],[6,7,"写入失败"],[7,8,"重试保存成功"],[6,8,"保存成功"]],"rule":"运动会话拥有计数真源。暂停、隐私关闭与离画不计数；网络断开不清零；保存成功后再显示结果。","open":"入镜稳定时间、长暂停结束政策、远程继续权限须评审。"},{"id":"task","title":"任务与计划","owner":"发布方配置 + 设备执行","states":[{"id":"task0","name":"草稿","note":"动作与目标"},{"id":"task1","name":"校验失败","note":"单位与支持动作"},{"id":"task2","name":"发送中","note":"幂等命令"},{"id":"task3","name":"等待确认","note":"超时不假装失败"},{"id":"task4","name":"已送达","note":"尚未开始"},{"id":"task5","name":"执行中","note":"固定启动版本"},{"id":"task6","name":"已完成","note":"真实会话达标"},{"id":"task7","name":"未达标","note":"保留部分努力"},{"id":"task8","name":"取消/过期","note":"不再启动"}],"edges":[[0,1,"输入无效"],[0,2,"校验通过"],[2,3,"离线/超时"],[3,2,"同命令重试"],[2,4,"设备确认"],[4,5
