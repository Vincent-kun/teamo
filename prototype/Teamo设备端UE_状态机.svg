<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1200" style="color-scheme:light dark;background:Canvas;color:CanvasText;font-family:system-ui"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="CanvasText"/></marker></defs><g fill="CanvasText"><path d="M625 104V150" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="132" font-size="13">自主运动</text><path d="M625 224V290" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="261" font-size="13">目标确认</text><path d="M625 364V410" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="392" font-size="13">持续满足准备</text><path d="M625 484V530" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="515" font-size="13">明确开始</text><path d="M625 604V650" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="633" font-size="13">最后复查通过</text><path d="M625 724V800" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="765" font-size="13">达标 / 提前结束</text><path d="M625 874V960" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="635" y="920" font-size="13">本地保存成功</text><path d="M490 67H195V150" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="210" y="58" font-size="13">收到家长任务</text><path d="M195 224V290" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="205" y="263" font-size="13">加入待办</text><path d="M330 187H400V327H490" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="344" y="180" font-size="13">马上开始</text><path d="M330 327H490" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="316" font-size="13">选择任务开始</text><path d="M760 687H900" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="780" y="676" font-size="13">暂停 / 离画</text><path d="M1035 650V265H795V327H760" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="813" y="255" font-size="13">明确继续 → 重查站位</text><path d="M1035 724V770H760V830" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="785" y="758" font-size="13">提前结束</text><path d="M760 837H900" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="785" y="825" font-size="13">保存失败</text><path d="M1035 874V911H820V860H760" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="830" y="899" font-size="13">重试</text><path d="M490 567H450V327H490" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="340" y="558" font-size="13">倒计时离画</text><path d="M490 997H20V67H490" fill="none" stroke="CanvasText" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="1050" font-size="13">返回首页</text><g data-node="idle" tabindex="0" role="button" aria-label="首页 / 学伴表情"><rect x="490" y="30" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="60" text-anchor="middle" font-size="18">首页 / 学伴表情</text><text x="625" y="85" text-anchor="middle" font-size="13">UE已有</text></g><g data-node="select" tabindex="0" role="button" aria-label="选运动 → 设目标"><rect x="490" y="150" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="180" text-anchor="middle" font-size="18">选运动 → 设目标</text><text x="625" y="205" text-anchor="middle" font-size="13">select / target</text></g><g data-node="entry" tabindex="0" role="button" aria-label="站位检查"><rect x="490" y="290" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="320" text-anchor="middle" font-size="18">站位检查</text><text x="625" y="345" text-anchor="middle" font-size="13">entry</text></g><g data-node="ready" tabindex="0" role="button" aria-label="已站好 / 确认开始"><rect x="490" y="410" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="440" text-anchor="middle" font-size="18">已站好 / 确认开始</text><text x="625" y="465" text-anchor="middle" font-size="13">ready</text></g><g data-node="countdown" tabindex="0" role="button" aria-label="3 → 2 → 1"><rect x="490" y="530" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="560" text-anchor="middle" font-size="18">3 → 2 → 1</text><text x="625" y="585" text-anchor="middle" font-size="13">countdown</text></g><g data-node="running" tabindex="0" role="button" aria-label="识别与计数"><rect x="490" y="650" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="680" text-anchor="middle" font-size="18">识别与计数</text><text x="625" y="705" text-anchor="middle" font-size="13">running</text></g><g data-node="save" tabindex="0" role="button" aria-label="结束 / 本地保存"><rect x="490" y="800" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" stroke-dasharray="6 4"/><text x="625" y="830" text-anchor="middle" font-size="18">结束 / 本地保存</text><text x="625" y="855" text-anchor="middle" font-size="13">新增补齐</text></g><g data-node="result" tabindex="0" role="button" aria-label="完成反馈 → 结果"><rect x="490" y="960" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="625" y="990" text-anchor="middle" font-size="18">完成反馈 → 结果</text><text x="625" y="1015" text-anchor="middle" font-size="13">celebrate / result</text></g><g data-node="task" tabindex="0" role="button" aria-label="新任务提示 → 详情"><rect x="60" y="150" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="195" y="180" text-anchor="middle" font-size="18">新任务提示 → 详情</text><text x="195" y="205" text-anchor="middle" font-size="13">task_arrive / task_alert</text></g><g data-node="todo" tabindex="0" role="button" aria-label="待办任务"><rect x="60" y="290" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="195" y="320" text-anchor="middle" font-size="18">待办任务</text><text x="195" y="345" text-anchor="middle" font-size="13">todo</text></g><g data-node="pause" tabindex="0" role="button" aria-label="暂停 / 等孩子回来"><rect x="900" y="650" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="1035" y="680" text-anchor="middle" font-size="18">暂停 / 等孩子回来</text><text x="1035" y="705" text-anchor="middle" font-size="13">pause / away</text></g><g data-node="privacy" tabindex="0" role="button" aria-label="隐私关闭 / 采集阻断"><rect x="900" y="410" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" /><text x="1035" y="440" text-anchor="middle" font-size="18">隐私关闭 / 采集阻断</text><text x="1035" y="465" text-anchor="middle" font-size="13">privacy</text></g><g data-node="save_error" tabindex="0" role="button" aria-label="保存失败 / 重试"><rect x="900" y="800" width="270" height="74" rx="8" fill="Canvas" stroke="CanvasText" stroke-dasharray="6 4"/><text x="1035" y="830" text-anchor="middle" font-size="18">保存失败 / 重试</text><text x="1035" y="855" text-anchor="middle" font-size="13">新增补齐</text></g><text x="40" y="1105" font-size="16">跨环节规则：隐私关闭 → 立即停止采集；断网 ≠ 停止运动；同步失败 ≠ 成绩丢失。</text><text x="40" y="1140" font-size="16">虚线框为建议新增状态。箭头是研发评审建议；点击节点查看与UE的对应。</text></g></svg>