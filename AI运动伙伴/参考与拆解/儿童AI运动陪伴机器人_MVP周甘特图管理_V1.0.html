  <style>

    .week-settings{display:grid;grid-template-columns:1.1fr 180px 1.8fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:0 4px 15px rgba(19,55,77,.05);margin-bottom:14px}.setting label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:5px}.field{height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:0 11px;min-width:0;width:100%}.field:focus,.note:focus{outline:3px solid rgba(37,139,112,.14);border-color:var(--teal)}.summary{display:grid;grid-template-columns:minmax(280px,1.4fr) repeat(4,minmax(130px,.65fr));gap:12px;margin-bottom:14px}.project-card,.metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 15px rgba(19,55,77,.05)}.project-card{padding:18px 20px;display:flex;align-items:center;gap:18px}.ring{--p:0;width:78px;height:78px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),#dfe9ed 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:white}.ring strong{position:relative;z-index:1;color:var(--navy);font-size:1.1rem}.project-card h2{font-size:1rem;margin:0 0 6px}.project-card p{font-size:.82rem;color:var(--muted);margin:0}.metric{padding:14px 15px;min-height:92px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;right:-18px;bottom:-24px;width:70px;height:70px;border-radius:50%;background:var(--sky)}.metric span{font-size:.78rem;color:var(--muted)}.metric strong{display:block;font-size:1.65rem;color:var(--navy);margin-top:7px;position:relative;z-index:1}

    .gantt-shell{background:#fff;border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:auto;box-shadow:var(--shadow);max-height:calc(100vh - 350px)}.gantt{min-width:1490px}.grid{display:grid;grid-template-columns:78px 280px 160px 100px 70px 90px repeat(7,minmax(100px,1fr))}.column-head{position:sticky;top:0;z-index:17;background:var(--navy);color:#fff;border-bottom:1px solid #0b2c42}.head-cell{padding:9px 8px;font-size:.74rem;font-weight:700;border-right:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;text-align:center}.head-cell.task{text-align:left;justify-content:flex-start}.head-cell.current{background:var(--teal)}.head-cell small{display:block;font-weight:400;color:#c9d7de;margin-top:2px}.module-row{background:#e9f0f4;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:42px}.module-name{grid-column:1/14;padding:9px 14px;color:var(--navy);font-weight:800;display:flex;align-items:center;gap:10px}.module-name small{font-weight:500;color:var(--muted);margin-left:auto}.task-row{position:relative;min-height:64px;border-bottom:1px solid #edf1f3;background:#fff;cursor:pointer}.task-row:nth-child(even){background:#fbfcfd}.task-row:hover{background:#f2f8fa}.task-row:focus{outline:3px solid rgba(37,139,112,.25);outline-offset:-3px}.cell{padding:9px;display:flex;align-items:center;border-right:1px solid #edf1f3;min-width:0}.code{font-family:ui-monospace,Consolas,monospace;font-size:.72rem;color:var(--muted)}.task-name{font-size:.84rem;font-weight:700;color:var(--navy)}.task-name .sub{display:block;color:var(--muted);font-weight:400;font-size:.68rem;margin-top:3px}.owner{font-size:.74rem;color:#425867}.center{justify-content:center}.pill{font-size:.7rem;font-weight:700;padding:5px 8px;border-radius:999px;white-space:nowrap}.status-未开始{background:#edf1f3;color:#607480}.status-进行中{background:#e4f1f8;color:#21698f}.status-阻塞{background:var(--redbg);color:var(--red)}.status-待验收{background:var(--purplebg);color:var(--purple)}.status-已完成{background:var(--mint);color:var(--teal)}.priority-P0{background:#fff0ec;color:#b33c26}.priority-P1{background:#fff5df;color:#976200}.priority-P2{background:#edf3f6;color:#587080}.day-cell{padding:7px;border-right:1px solid #e4ebef;display:flex;align-items:center;justify-content:center;position:relative}.day-cell.current{background:rgba(37,139,112,.055)}.day-chip{width:100%;min-height:42px;border-radius:9px;background:#edf3f6;color:#526875;padding:6px;text-align:center;font-size:.68rem;display:flex;flex-direction:column;justify-content:center}.day-chip strong{color:var(--navy);font-size:.8rem}.day-chip.active{background:linear-gradient(145deg,#dff3eb,#edf8f4);box-shadow:inset 0 0 0 1px rgba(37,139,112,.22)}.day-chip.active strong{color:var(--teal)}.empty{padding:54px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--navy);font-size:1rem;margin-bottom:8px}
    .backdrop{position:fixed;inset:0;background:rgba(6,24,35,.45);z-index:70;opacity:0;pointer-events:none;transition:.2s}.backdrop.open{opacity:1;pointer-events:auto}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(620px,94vw);background:#fff;z-index:71;transform:translateX(102%);transition:.24s;box-shadow:-20px 0 50px rgba(4,27,42,.2);display:flex;flex-direction:column}.drawer.open{transform:none}.drawer-head{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.drawer-head h2{font-size:1.08rem;margin:3px 0 4px}.drawer-head p{margin:0;font-size:.78rem;color:var(--muted)}.close{margin-left:auto;border:0;background:#edf3f6;width:38px;height:38px;border-radius:10px;font-size:1.3rem}.drawer-body{padding:18px 22px 28px;overflow:auto}.edit-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}.label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:5px}.field[multiple]{height:96px;padding:8px 10px}.day-editor{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0 16px}.day-input{background:#f6f9fa;border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center}.day-input span{display:block;font-size:.7rem;color:var(--muted);margin-bottom:5px}.day-input input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;text-align:center}.note{width:100%;min-height:82px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}.drawer-actions{display:flex;gap:9px;margin-top:18px}.drawer-actions .btn{flex:1}
    dialog{border:0;border-radius:16px;padding:0;box-shadow:0 22px 70px rgba(10,36,52,.25);width:min(760px,94vw);max-width:none}dialog::backdrop{background:rgba(6,24,35,.5)}.dialog-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}.dialog-head h2{margin:0;font-size:1.08rem}.dialog-head p{margin:3px 0 0;color:var(--muted);font-size:.78rem}.dialog-body{padding:14px 20px}.picker-tools{display:grid;grid-template-columns:1fr 200px;gap:10px;margin-bottom:12px}.task-list{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:12px}.pick-row{display:grid;grid-template-columns:34px 76px 1fr 120px;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #edf1f3}.pick-row:last-child{border-bottom:0}.pick-row:hover{background:#f5f9fa}.pick-row b{font-size:.82rem;color:var(--navy)}.pick-row small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}.dialog-actions{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--navy2);color:#fff;padding:10px 16px;border-radius:10px;font-size:.82rem;z-index:100;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1050px){.main{padding:16px}.week-settings{grid-template-columns:1fr 180px}.week-settings .goal{grid-column:1/3}.summary{grid-template-columns:1.4fr repeat(2,1fr)}.metric:nth-of-type(4),.metric:nth-of-type(5){display:none}.toolbar{grid-template-columns:auto 1fr 160px}.toolbar .secondary-filter,.toolbar .export{display:none}.gantt-shell{max-height:520px}}

<body>
  <header class="topbar"><div class="topbar-inner"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 17V9m7 8V5m7 12v-6" stroke="white" stroke-width="3" stroke-linecap="round"/></svg></div><div><h1>儿童AI运动陪伴机器人 · 周甘特图管理</h1><p>从MVP总甘特图选择任务，自定义周一至周日安排</p></div></div><span class="save-state" id="saveState">修改自动保存在当前浏览器</span></div></header>
  <main class="main">
    <section class="week-settings" aria-label="周计划设置">
      <div class="setting"><label for="weekName">周计划名称</label><input class="field" id="weekName" value="本周执行计划"></div>
      <div class="setting"><label for="weekStart">本周星期一</label><input class="field" id="weekStart" type="date"></div>
      <div class="setting goal"><label for="weekGoal">本周目标</label><input class="field" id="weekGoal" placeholder="例如：完成开合跳黄金链路首通"></div>
      <button class="btn btn-secondary" id="clearWeek">清空本周安排</button>
    </section>
    <section class="summary" aria-label="周计划概况">
      <article class="project-card"><div class="ring" id="progressRing"><strong id="progressText">0%</strong></div><div><h2 id="summaryTitle">本周执行进度</h2><p id="summaryCaption">从总甘特图选择任务后开始安排。</p></div></article>
      <article class="metric"><span>本周任务</span><strong id="taskCount">0</strong></article>
      <article class="metric"><span>计划工时</span><strong id="hourCount">0</strong></article>
      <article class="metric"><span>已完成</span><strong id="doneCount">0</strong></article>
      <article class="metric"><span>已安排天数</span><strong id="dayCount">0</strong></article>
    </section>
    <section aria-label="周任务甘特图">
      <div class="toolbar">
        <button class="btn btn-accent" id="addTask">＋ 从总甘特图选择任务</button>
        <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input class="field" id="search" placeholder="搜索本周任务或WBS编号"></div>
        <select class="field" id="moduleFilter" aria-label="按模块筛选"></select>
        <select class="field secondary-filter" id="statusFilter" aria-label="按状态筛选"></select>
        <button class="btn btn-secondary export" id="exportCsv">导出周计划</button>
        <select class="field" id="currentDay" aria-label="当前日期"></select>
      </div>
      <div class="result-line"><span>显示 <strong id="visibleCount">0</strong> 项周任务</span><span id="filterHint">全部模块</span><div class="legend"><span><i class="dot plan"></i>未开始</span><span><i class="dot doing"></i>进行中</span><span><i class="dot done"></i>已完成</span><span><i class="dot blocked"></i>阻塞</span></div></div>
      <div class="gantt-shell" id="ganttShell"><div class="gantt" id="gantt"></div></div>
    </section>
  </main>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><div><p id="drawerCode"></p><h2 id="drawerTitle"></h2><p id="drawerMeta"></p></div><button class="close" id="closeDrawer" aria-label="关闭任务编辑">×</button></div><div class="drawer-body">
    <div class="edit-grid"><label><span class="label">任务状态</span><select class="field" id="editStatus"></select></label><label><span class="label">任务优先级</span><select class="field" id="editPriority"></select></label><label><span class="label">负责人（可多选）</span><select class="field" id="editOwner" multiple size="4" aria-label="可多选负责人"></select></label></div>
    <span class="label">每日计划工时（可填写0.5至24小时）</span><div class="day-editor" id="dayEditor"></div>
    <label><span class="label">本周执行备注</span><textarea class="note" id="editNote" placeholder="填写交付物、阻塞原因、协作要求或验收证据"></textarea></label>
    <div class="drawer-actions"><button class="btn btn-primary" id="saveTask">保存安排</button><button class="btn btn-danger" id="removeTask">移出本周</button></div>
  </div></aside>

  <dialog id="taskPicker"><div class="dialog-head"><div><h2>从MVP总甘特图选择任务</h2><p>可多选任务加入本周，已加入的任务不会重复显示。</p></div><button class="close" id="closePicker" aria-label="关闭任务选择">×</button></div><div class="dialog-body"><div class="picker-tools"><input class="field" id="pickerSearch" placeholder="搜索任务、模块或WBS编号"><select class="field" id="pickerModule"></select></div><div class="task-list" id="taskList"></div></div><div class="dialog-actions"><span id="pickCount">已选择0项</span><div><button class="btn btn-secondary" id="cancelPicker">取消</button> <button class="btn btn-accent" id="confirmPicker">加入本周计划</button></div></div></dialog>
  <dialog id="clearDialog"><div class="dialog-head"><div><h2>清空本周安排？</h2><p>这会移除本周任务及每天工时，周名称和目标保持不变。</p></div></div><div class="dialog-actions"><button class="btn btn-secondary" id="cancelClear">取消</button><button class="btn btn-danger" id="confirmClear">确认清空</button></div></dialog>
  <div class="toast" id="toast" role="status"></div>

    const DAYS=['周一','周二','周三','周四','周五','周六','周日'];
    const statuses=['未开始','进行中','阻塞','待验收','已完成'];
    const priorities=['P0','P1','P2'];
    const owners=['夏炜城','魏子奇','李沁佟'];
    const ownerOptions=['未分配',...owners];
    const PLAN_STORE='mvp-weekly-gantt-v1-plan',SETTINGS_STORE='mvp-weekly-gantt-v1-settings';
    const $=id=>document.getElementById(id);
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
    const monday=()=>{const d=new Date(),day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return localDate(d)};
    const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    let plan=read(PLAN_STORE,[]),settings=read(SETTINGS_STORE,{name:'本周执行计划',start:monday(),goal:'',currentDay:Math.min(6,(new Date().getDay()+6)%7)}),selectedId=null,picked=new Set(),filters={search:'',module:'全部模块',status:'全部状态'},pickerFilters={search:'',module:'全部模块'};
    function ownerList(value){if(Array.isArray(value))return owners.filter(x=>value.includes(x));if(typeof value==='string')return value.split(/[、,，]/).map(x=>x.trim()).filter(x=>owners.includes(x));return []}
    function ownerText(value){return ownerList(value).join('、')||'未分配'}
    function ownerSelection(value){const list=ownerList(value);return list.length?list:['未分配']}
    function normalize(){plan=plan.filter(p=>masterTasks.some(t=>t.id===p.id)).map(p=>({...p,owner:ownerList(p.owner),hours:Array.from({length:7},(_,i)=>Number(p.hours?.[i]||0))}));settings.currentDay=Math.min(6,Math.max(0,Number(settings.currentDay)||0))}
    function save(){localStorage.setItem(PLAN_STORE,JSON.stringify(plan));localStorage.setItem(SETTINGS_STORE,JSON.stringify(settings));$('saveState').textContent='刚刚已保存到当前浏览器'}
    function options(el,items,value){const selected=new Set(Array.isArray(value)?value.map(String):[String(value)]);el.innerHTML=items.map((x,i)=>{const v=typeof x==='object'?x.value:x,label=typeof x==='object'?x.label:x;return `<option value="${esc(v)}" ${selected.has(String(v))?'selected':''}>${esc(label)}</option>`}).join('')}
    function task(id){return masterTasks.find(t=>t.id===id)}
    function combined(p){return {...task(p.id),...p}}
    function dates(){const start=new Date(settings.start+'T00:00:00');return DAYS.map((name,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return {name,date:`${d.getMonth()+1}/${d.getDate()}`}})}
    function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    function setup(){normalize();$('weekName').value=settings.name;$('weekStart').value=settings.start;$('weekGoal').value=settings.goal;options($('moduleFilter'),['全部模块',...new Set(masterTasks.map(t=>t.l1))],filters.module);options($('statusFilter'),['全部状态',...statuses],filters.status);options($('pickerModule'),['全部模块',...new Set(masterTasks.map(t=>t.l1))],pickerFilters.module);options($('currentDay'),DAYS.map((x,i)=>({value:i,label:`当前：${x}`})),settings.currentDay);options($('editStatus'),statuses,'未开始');options($('editPriority'),priorities,'P1');options($('editOwner'),ownerOptions,['未分配']);bind();render();registerWebMCP()}
    function bind(){['weekName','weekGoal'].forEach(id=>$(id).addEventListener('input',e=>{settings[id==='weekName'?'name':'goal']=e.target.value;save();renderSummary()}));$('weekStart').addEventListener('change',e=>{settings.start=e.target.value||monday();save();renderGantt()});$('currentDay').addEventListener('change',e=>{settings.currentDay=Number(e.target.value);save();renderGantt()});$('search').addEventListener('input',e=>{filters.search=e.target.value.trim().toLowerCase();renderGantt()});$('moduleFilter').addEventListener('change',e=>{filters.module=e.target.value;renderGantt()});$('statusFilter').addEventListener('change',e=>{filters.status=e.target.value;renderGantt()});$('addTask').addEventListener('click',openPicker);$('closePicker').addEventListener('click',closePicker);$('cancelPicker').addEventListener('click',closePicker);$('pickerSearch').addEventListener('input',e=>{pickerFilters.search=e.target.value.trim().toLowerCase();renderPicker()});$('pickerModule').addEventListener('change',e=>{pickerFilters.module=e.target.value;renderPicker()});$('confirmPicker').addEventListener('click',addPicked);$('closeDrawer').addEventListener('click',closeDrawer);$('backdrop').addEventListener('click',closeDrawer);$('saveTask').addEventListener('click',saveSelected);$('removeTask').addEventListener('click',removeSelected);$('exportCsv').addEventListener('click',exportCsv);$('clearWeek').addEventListener('click',()=>$('clearDialog').showModal());$('cancelClear').addEventListener('click',()=>$('clearDialog').close());$('confirmClear').addEventListener('click',()=>{plan=[];save();$('clearDialog').close();render();toast('本周任务已清空')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()})}
    function filtered(){return plan.map(combined).filter(t=>{const hay=[t.id,t.l1,t.l2,t.name,t.owner].join(' ').toLowerCase();return(!filters.search||hay.includes(filters.search))&&(filters.module==='全部模块'||t.l1===filters.module)&&(filters.status==='全部状态'||t.status===filters.status)})}
    function render(){renderSummary();renderGantt()}
    function renderSummary(){const ts=plan.map(combined),totalHours=ts.reduce((a,t)=>a+t.hours.reduce((x,y)=>x+Number(y||0),0),0),done=ts.filter(t=>t.status==='已完成').length,pct=ts.length?Math.round(done/ts.length*100):0,usedDays=ts.length?Array.from({length:7},(_,i)=>ts.some(t=>Number(t.hours[i])>0)).filter(Boolean).length:0;$('progressRing').style.setProperty('--p',pct);$('progressText').textContent=pct+'%';$('summaryTitle').textContent=settings.name||'本周执行进度';$('summaryCaption').textContent=settings.goal||'从总甘特图选择任务后，填写每天计划工时。';$('taskCount').textContent=ts.length;$('hourCount').textContent=Number(totalHours.toFixed(1));$('doneCount').textContent=done;$('dayCount').textContent=usedDays}
    function renderGantt(){const ts=filtered(),ds=dates();$('visibleCount').textContent=ts.length;$('filterHint').textContent=[filters.module,filters.status].filter(x=>!x.startsWith('全部')).join(' · ')||'全部模块';const heads=ds.map((d,i)=>`<div class="head-cell ${i===settings.currentDay?'current':''}"><div>${d.name}<small>${d.date}</small></div></div>`).join('');let html=`<div class="grid column-head"><div class="head-cell">WBS</div><div class="head-cell task">任务</div><div class="head-cell">负责人</div><div class="head-cell">状态</div><div class="head-cell">优先级</div><div class="head-cell">总工时</div>${heads}</div>`;if(!ts.length){$('gantt').innerHTML=html+`<div class="empty"><b>本周还没有安排任务</b>点击“从总甘特图选择任务”，再为每天填写计划工时。</div>`;return}const groups=new Map();ts.forEach(t=>{if(!groups.has(t.l1))groups.set(t.l1,[]);groups.get(t.l1).push(t)});for(const [module,items] of groups){html+=`<div class="grid module-row"><div class="module-name"><span>${esc(module)}</span><small>${items.length}项 · ${items.reduce((a,t)=>a+t.hours.reduce((x,y)=>x+Number(y||0),0),0).toFixed(1)}小时</small></div></div>`;for(const t of items){const total=t.hours.reduce((a,b)=>a+Number(b||0),0);const dayCells=t.hours.map((h,i)=>`<div class="day-cell ${i===settings.currentDay?'current':''}" data-day="${i}"><div class="day-chip ${Number(h)>0?'active':''}">${Number(h)>0?`<strong>${Number(h)}小时</strong><span>${esc(t.dayNotes?.[i]||'已安排')}</span>`:'—'}</div></div>`).join('');html+=`<div class="grid task-row" data-id="${esc(t.id)}" tabindex="0" role="button" aria-label="编辑周任务 ${esc(t.name)}"><div class="cell code">${esc(t.id)}</div><div class="cell task-name"><div>${esc(t.name)}<span class="sub">${esc(t.l2)}</span></div></div><div class="cell owner">${esc(ownerText(t.owner))}</div><div class="cell center"><span class="pill status-${esc(t.status)}">${esc(t.status)}</span></div><div class="cell center"><span class="pill priority-${esc(t.priority)}">${esc(t.priority)}</span></div><div class="cell center"><b>${Number(total.toFixed(1))}</b></div>${dayCells}</div>`}}$('gantt').innerHTML=html;document.querySelectorAll('.task-row').forEach(el=>{const open=()=>openTask(el.dataset.id);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
    function openPicker(){picked=new Set();$('pickerSearch').value='';pickerFilters.search='';pickerFilters.module='全部模块';$('pickerModule').value='全部模块';renderPicker();$('taskPicker').showModal()}
    function closePicker(){$('taskPicker').close()}
    function renderPicker(){const used=new Set(plan.map(p=>p.id)),ts=masterTasks.filter(t=>!used.has(t.id)&&(pickerFilters.module==='全部模块'||t.l1===pickerFilters.module)&&(!pickerFilters.search||[t.id,t.l1,t.l2,t.name].join(' ').toLowerCase().includes(pickerFilters.search)));$('taskList').innerHTML=ts.length?ts.map(t=>`<label class="pick-row"><input type="checkbox" value="${esc(t.id)}" ${picked.has(t.id)?'checked':''}><span class="code">${esc(t.id)}</span><span><b>${esc(t.name)}</b><small>${esc(t.l1)} / ${esc(t.l2)} · ${t.hours}小时</small></span><span class="pick-owner">${esc(t.owner)}</span></label>`).join(''):`<div class="empty">没有可加入的任务。</div>`;document.querySelectorAll('#taskList input').forEach(el=>el.addEventListener('change',()=>{el.checked?picked.add(el.value):picked.delete(el.value);$('pickCount').textContent=`已选择${picked.size}项`})) ;$('pickCount').textContent=`已选择${picked.size}项`}
    function addPicked(){if(!picked.size){toast('请先选择任务');return}const added=[...picked].filter(id=>!plan.some(p=>p.id===id));added.forEach(id=>{const t=task(id);plan.push({id,status:t.status,priority:t.priority,owner:[],hours:[0,0,0,0,0,0,0],dayNotes:['','','','','','',''],note:''})});save();closePicker();render();toast(`已加入${added.length}项任务`);if(added.length===1)openTask(added[0])}
    function openTask(id){const p=plan.find(x=>x.id===id),t=combined(p);if(!p)return;selectedId=id;$('drawerCode').textContent=`${t.id} · ${t.l1} / ${t.l2}`;$('drawerTitle').textContent=t.name;$('drawerMeta').textContent=`总甘特图计划第${t.start}–${t.end}周 · 默认协作角色：${t.collab||'未设置'}`;options($('editStatus'),statuses,t.status);options($('editPriority'),priorities,t.priority);options($('editOwner'),ownerOptions,ownerSelection(t.owner));$('editNote').value=t.note||'';const ds=dates();$('dayEditor').innerHTML=ds.map((d,i)=>`<label class="day-input"><span>${d.name}<br>${d.date}</span><input type="number" min="0" max="24" step="0.5" value="${Number(t.hours[i]||0)}" data-day-hour="${i}" aria-label="${d.name}计划工时"></label>`).join('');$('drawer').classList.add('open');$('backdrop').classList.add('open');$('drawer').setAttribute('aria-hidden','false');$('closeDrawer').focus()}
    function closeDrawer(){$('drawer').classList.remove('open');$('backdrop').classList.remove('open');$('drawer').setAttribute('aria-hidden','true')}
    function saveSelected(){const p=plan.find(x=>x.id===selectedId);if(!p)return;p.status=$('editStatus').value;p.priority=$('editPriority').value;p.owner=[...$('editOwner').selectedOptions].map(o=>o.value).filter(x=>owners.includes(x));p.note=$('editNote').value;p.hours=[...document.querySelectorAll('[data-day-hour]')].map(el=>Math.min(24,Math.max(0,Number(el.value)||0)));save();render();closeDrawer();toast('每日任务安排已保存')}
    function removeSelected(){const t=task(selectedId);plan=plan.filter(x=>x.id!==selectedId);save();render();closeDrawer();toast(`已移出：${t?.name||'任务'}`)}
    function exportCsv(){const ds=dates(),header=['WBS编号','一级模块','二级模块','任务','负责人','状态','优先级',...ds.map(d=>`${d.name} ${d.date} 工时`),'总工时','本周备注'],rows=[header,...plan.map(combined).map(t=>[t.id,t.l1,t.l2,t.name,ownerText(t.owner),t.status,t.priority,...t.hours,Number(t.hours.reduce((a,b)=>a+Number(b||0),0).toFixed(1)),t.note||''])];const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`${settings.name||'MVP周计划'}_${settings.start}.csv`;a.click();URL.revokeObjectURL(a.href);toast('周计划已导出')}
    function addById(id){if(!masterTasks.some(t=>t.id===id))throw new Error('总甘特图中不存在该任务');if(plan.some(p=>p.id===id))return {id,added:false};const t=task(id);plan.push({id,status:t.status,priority:t.priority,owner:[],hours:[0,0,0,0,0,0,0],dayNotes:['','','','','','',''],note:''});save();render();return {id,added:true}}
    function registerWebMCP(){const context=document.modelContext;if(!context?.registerTool)return;const reg=t=>Promise.resolve(context.registerTool(t)).catch(()=>{});reg({name:'list_weekly_plan_tasks',title:'查询本周任务',description:'查询当前周甘特图中的任务、负责人和每日计划工时。',inputSchema:{type:'object',properties:{status:{type:'string'},module:{type:'string'}},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute(input={}){return plan.map(combined).filter(t=>(!input.status||t.status===input.status)&&(!input.module||t.l1===input.module)).map(t=>({id:t.id,name:t.name,module:t.l1,owner:ownerList(t.owner),status:t.status,priority:t.priority,dailyHours:Object.fromEntries(DAYS.map((d,i)=>[d,t.hours[i]])),note:t.note||''}))}});reg({name:'add_master_task_to_week',title:'加入总甘特图任务',description:'按WBS编号把MVP总甘特图任务加入本周计划。',inputSchema:{type:'object',properties:{id:{type:'string'}},required:['id'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){return addById(input.id)}});reg({name:'update_weekly_task_schedule',title:'更新每日任务安排',description:'更新本周任务、负责人和周一至周日计划工时。',inputSchema:{type:'object',properties:{id:{type:'string'},owner:{type:'array',items:{type:'string',enum:owners}},status:{type:'string',enum:statuses},hours:{type:'array',items:{type:'number',minimum:0,maximum:24},minItems:7,maxItems:7},note:{type:'string'}},required:['id','hours'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){const p=plan.find(x=>x.id===input.id);if(!p)throw new Error('本周计划中不存在该任务');p.hours=input.hours.map(Number);if(input.owner!==undefined)p.owner=ownerList(input.owner);if(input.status)p.status=input.status;if(input.note!==undefined)p.note=input.note;save();render();return {id:p.id,saved:true,totalHours:p.hours.reduce((a,b)=>a+b,0),owner:ownerText(p.owner)}}})}
    setup();
  </script>
