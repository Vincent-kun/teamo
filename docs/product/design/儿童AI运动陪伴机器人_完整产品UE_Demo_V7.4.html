function saveAIPlan(){const p=state.aiPlan;if(!p)return;if(!state.savedPlans.some(x=>x.id===p.id)){state.savedPlans.unshift(p);state.aiHistory.unshift({type:'plan',title:p.name,time:'刚刚'});toast('计划已保存，首页和任务中已更新')}else toast('计划已经保存');renderAll()}
function sendTodayPlan(id){const p=state.savedPlans.find(x=>x.id===id)||state.aiPlan;if(!p)return toast('请先生成训练计划');if(!state.savedPlans.some(x=>x.id===p.id)){state.savedPlans.unshift(p);state.aiHistory.unshift({type:'plan',title:p.name,time:'刚刚'})}const day=(p.days[2]&&p.days[2].items.length?p.days[2]:p.days.find(d=>d.items.length))||p.days[0];state.pending={type:'plan',source:'AI计划',name:p.name,items:day.items,target:day.items.length,unit:'项'};state.planIndex=0;state.dmode='plan_alert';state.eye='curious';renderAll();toast('今天的训练已发送到机器人')}

function renderMealBuilder(){const d=state.mealDraft;return `${detailHead('生成健康食谱','家庭日常饮食参考')}<div class="app-body"><div class="form-label">孩子年龄</div><input class="text-input" value="${d.age}" oninput="state.mealDraft.age=this.value"><div class="form-label">饮食偏好</div>${choiceButtons(['清淡家常','均衡丰富','少油少盐','接受度优先'],d.preference,'setMealPreference')}<div class="form-label">是否有明确食物过敏</div><input class="text-input" value="${d.allergy}" oninput="state.mealDraft.allergy=this.value"><div class="form-label">不吃的食物</div><input class="text-input" value="${d.avoid}" placeholder="如：香菇" oninput="state.mealDraft.avoid=this.value"><div class="form-label">家庭常见食材</div><textarea class="text-area" oninput="state.mealDraft.ingredients=this.value">${d.ingredients}</textarea><div class="form-label">需要哪一餐</div>${choiceButtons(['早餐','午餐','晚餐','加餐'],d.meal,'setMealType')}<div class="disclaimer">不根据儿童体重提供减重、节食或医疗营养方案，也不设置卡路里限制。</div><button class="primary" style="width:100%;margin-top:14px" onclick="generateMockMealPlan()">生成饮食建议</button></div>`}
function setMealPreference(x){state.mealDraft.preference=x;renderAll()}function setMealType(x){state.mealDraft.meal=x;renderAll()}
function generateMockMealPlan(){const meal=state.mealDraft.meal;state.mealPlan={title:`今天${meal}建议`,items:[['主食','米饭或杂粮饭'],['蛋白质','番茄牛肉'],['蔬菜','清炒西兰花'],['水果','苹果']],reason:'包含主食、蛋白质、蔬菜和水果，搭配简单，方便家庭准备。'};state.aiHistory.unshift({type:'meal',title:state.mealPlan.title,time:'刚刚'});state.page='meal_result';renderAll();toast('饮食建议已生成')}
function renderMealResult(){const m=state.mealPlan;if(!m)return renderMealBuilder();return `${detailHead(m.title,'家庭日常饮食参考')}<div class="app-body"><section class="card meal-result"><h3>${m.title}</h3><div class="meal-grid">${m.items.map(x=>`<div class="meal-item"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div></section><div class="card summary-box" style="margin-top:10px"><h3>为什么这样搭配</h3><p>${m.reason}</p></div><div class="disclaimer">仅作为日常饮食参考；如孩子存在过敏、疾病或特殊营养需求，请遵循医生或营养专业人员建议。</div><div class="wizard-actions"><button class="secondary" onclick="generateMockMealPlan()">换一份</button><button class="primary" onclick="toast('已收藏到家庭食谱')">收藏</button></div><button class="secondary" style="width:100%;margin-top:8px" onclick="toast('一周家庭菜单已生成')">生成一周家庭菜单</button></div>`}
function renderAIQuestion(){const prompts=['为什么今天安排深蹲？','孩子这周运动够吗？','如何让孩子坚持运动？','今天晚餐怎么搭配？'];const chat=(state.aiChat||[]).filter((m,i)=>!(i===0&&m.role==='assistant'));const example='请为我安排一节家庭运动计划，时长10分钟，动作简单一点。';return `<div class="ai-chat-page"><div class="ai-chat-topbar"><button class="chat-menu-btn" onclick="toast('对话记录会在后续版本开放')" aria-label="对话记录">${iconExtra('menu',21)}</button><span>AI运动助手</span><button class="chat-close-btn" onclick="backApp()" aria-label="关闭">${iconExtra('close',22)}</button></div><div class="ai-chat-main"><div class="ai-welcome"><div class="ai-mark">${icon('spark',25)}</div><div class="ai-greeting"><p>你好，</p><h2>我是你的家庭运动助手。</h2><p>你可以问我关于<span>运动训练</span>的任何事情！</p></div><button class="ai-example" onclick="askQuestion('${example}')"><span class="example-icon">${icon('spark',17)}</span><span>${example}</span><span class="example-arrow">›</span></button></div>${chat.length?`<div class="chat-messages">${chat.map(m=>`<div class="chat-row ${m.role==='user'?'user':''}">${m.role==='assistant'?`<span class="chat-avatar">${icon('spark',14)}</span>`:''}<div class="chat-bubble"><p>${m.text}</p><span class="chat-time">${m.role==='user'?'你':'运动助手'}</span></div>${m.role==='user'?`<span class="chat-avatar user">${icon('mine',14)}</span>`:''}</div>`).join('')}</div>`:''}</div><div class="ai-chat-bottom"><div class="chat-suggestions">${prompts.map(p=>`<button onclick="askQuestion('${p}')">${p}</button>`).join('')}</div><div class="chat-composer"><textarea id="chatInput" placeholder="输入文字，或按住说话" oninput="state.aiDraftMessage=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}">${state.aiDraftMessage||''}</textarea><div class="chat-tools"><button onclick="toast('按住即可说话')" aria-label="语音输入">${icon('sound',18)}</button><button onclick="toast('可添加运动记录或照片')" aria-label="添加内容">${iconExtra('plus',19)}</button></div><button class="chat-send" onclick="sendChat()">发送</button></div><div class="chat-note">内容由AI生成，仅作运动与日常饮食参考</div></div></div>`}
function answerQuestion(q){if(q.includes('计划')||q.includes('安排'))return'可以。我会优先安排10分钟左右的简单动作，例如开合跳、深蹲起和高抬腿，动作之间留出短暂休息，完成后同步给家长。';if(q.includes('深蹲'))return'最近一周跳跃类运动较多，今天加入少量深蹲起，让训练内容更均衡。先做15次即可，动作不舒服就停止。';if(q.includes('够吗'))return'最近7天完成4次运动，习惯保持得不错。可以继续保持每次10分钟左右，不需要突然增加很多。';if(q.includes('坚持'))return'把任务控制在5～10分钟，固定在晚饭前或作业后，并让孩子自己选择一个动作，通常更容易坚持。';return'可以按“主食＋蛋白质＋蔬菜＋水果”简单搭配，并先确认孩子是否有明确食物过敏。'}
function askQuestion(q){state.aiQuestion=q;state.aiAnswer=answerQuestion(q);state.aiChat=state.aiChat||[];state.aiChat.push({role:'user',text:q},{role:'assistant',text:state.aiAnswer});state.aiDraftMessage='';renderAll();setTimeout(()=>{const el=$('#appScreen');if(el)el.scrollTop=el.scrollHeight},0)}function sendChat(){const q=(state.aiDraftMessage||'').trim();if(!q)return toast('先输入你想问的问题');askQuestion(q)}

function renderGrowth(){return `${appHead('成长','真实运动数据中心')}<div class="app-body"><section class="card growth-summary"><small style="color:var(--muted)">本周运动</small><div class="big-number">126 <span style="font-size:13px">分钟</span></div><div class="summary-row"><div><b>4次</b><span>运动次数</span></div><div><b>8 / 9</b><span>完成任务</span></div><div><b>${state.streak}天</b><span>连续运动</span></div></div></section>${sectionHead('运动趋势')}<section class="card trend-card"><svg viewBox="0 0 320 110"><path d="M8 92H312M8 58H312M8 24H312" stroke="#e5e9e6"/><path d="M10 86 C45 82 55 65 88 70 S135 37 165 48 S215 72 240 38 S275 28 308 18" fill="none" stroke="#4f8b73" stroke-width="3"/><circle cx="308" cy="18" r="4" fill="#4f8b73"/></svg><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted)"><span>周一</span><span>周三</span><span>周五</span><span>今天</span></div></section><button class="ai-insight" style="margin-top:10px" onclick="openAIQuestion('孩子这周运动够吗？')"><span class="row-icon">${icon('spark',18)}</span><span class="row-copy"><b>让AI分析本周运动</b><p>自动带入最近7天记录</p></span><span>›</span></button>${sectionHead('最近运动','全部记录',"openPage('records')")}${state.records.slice(0,2).map(recordRow).join('')}${sectionHead('动作成长')}<div class="action-grid">${actions.slice(0,4).map(actionCard).join('')}</div>${sectionHead('更多成长')}<div class="menu-list">${menuItem('trend','个人最好成绩','开合跳42次','best')}${menuItem('check','运动成就','连续运动7天','achievements')}${menuItem('posture','体态提醒','今天提醒'+state.lowHead+'次','posture')}${menuItem('school','学校运动','本周任务完成2次','school')}</div></div>`}
function menuItem(ico,title,sub,page){return `<button onclick="openPage('${page}')"><span class="row-icon">${icon(ico,18)}</span><span class="row-copy"><b>${title}</b><p>${sub}</p></span><span class="arrow">${icon('arrow',16)}</span></button>`}
function renderMine(){return `<div class="mine-body"><div class="mine-header"><div><small>家庭运动空间</small><h2>我的</h2></div><button class="icon-btn" onclick="openPage('notifications')" aria-label="消息">${icon('bell',19)}</button></div><div class="app-body"><section class="mine-profile-card"><div class="profile-main">${avatar()}<div class="profile-copy"><h2>${state.profileName}的家庭空间</h2><p>主要监护人 · 已绑定1名孩子</p></div><button class="edit-btn" onclick="openPage('profile')">编辑</button></div><div class="family-progress"><span><b>168</b>运动星</span><span><b>${state.streak}天</b>连续运动</span><span><b>${state.online?'在线':'离线'}</b>设备状态</span></div></section><div class="section-label">儿童档案</div><button class="card child-card" onclick="openPage('profile')">${avatar()}<div><b>${state.profileName}</b><small>9岁 · 三年级 · 当前孩子</small></div><span class="menu-arrow">${icon('arrow',16)}</span></button><div class="section-label">孩子身体数据</div><section class="card body-data-card"><div class="data-card-head"><div><b>个人数据采集</b><small>家长可随时更新</small></div><button class="edit-btn" onclick="openPage(&#39;profile&#39;)">编辑</button></div><div class="data-grid"><div><b>${state.childData.height}</b><small>身高 · 厘米</small></div><div><b>${state.childData.weight}</b><small>体重 · 千克</small></div><div><b>9</b><small>年龄 · 岁</small></div></div><p class="data-note">最近更新：${state.childData.updated} · 仅用于运动建议，不做医疗判断</p></section><div class="section-label">家庭与设备</div><div class="menu-list">${menuItem('device','我的设备',`客厅运动伙伴 · ${state.online?'在线':'离线'}`,'device')}${menuItem('users','家庭成员','妈妈为主要监护人','family')}${menuItem('school','学校绑定','阳光小学 · 三年级2班','school_bind')}</div><div class="section-label">偏好与安全</div><div class="menu-list">${menuItem('shield','隐私与安全','授权、数据查看和删除','privacy')}${menuItem('bell','消息通知','任务、设备和学校消息','notifications')}${menuItem('moon','免打扰','21:00～07:00','quiet')}${menuItem('help','帮助与反馈','常见问题和问题反馈','help')}${menuItem('info','关于','产品与服务说明','about')}</div></div></div>`}

function renderDetail(){switch(state.page){case'device':return renderDeviceDetail();case'device_settings':return renderDeviceSettings();case'library':return renderLibrary();case'action':return renderActionDetail();case'plan':return renderPlanResult();case'ai_plan_builder':return renderAIPlanBuilder();case'ai_plan_result':return renderPlanResult();case'ai_meal_builder':return renderMealBuilder();case'meal_result':return renderMealResult();case'ai_question':return renderAIQuestion();case'records':return renderRecords();case'report':return renderReport();case'profile':return renderProfile();case'posture':return renderPosture();case'school':return renderSchool();default:return renderSimpleDetail()}}
function renderDeviceDetail(){const status=deviceStatusText();return `${detailHead('设备详情','客厅运动伙伴')}<div class="app-body"><section class="card device-detail-visual">${robotVisual()}<div><div class="online-line"><i class="status-dot ${state.online?'':'offline'}"></i>${state.online?'在线':'离线'}</div><h3 style="margin:7px 0 4px">客厅运动伙伴</h3><div style="font-size:11px">当前：${status}</div><div style="font-size:9px;color:var(--muted);margin-top:4px">${state.online?'最后同步：刚刚':'最后在线：18:32'}</div></div></section>${sectionHead('当前状态')}<section class="card summary-box"><h3>${status}</h3><p>${currentDeviceLine()}</p>${status==='运动中'?`<button class="link-btn" onclick="toast('已定位到设备实时画面')">查看实时状态</button>`:''}</section>${sectionHead('设备状态')}<div class="status-grid"><div class="card status-cell"><span class="mini-icon">${icon('wifi')}</span><b>网络</b><span>${state.online?'无线网络已连接':'未连接'}</span></div><div class="card status-cell"><span class="mini-icon">${icon('camera')}</span><b>摄像头</b><span>${state.settings.camera?'可用 · 已授权':'未授权'}</span></div><div class="card status-cell"><span class="mini-icon">${icon('sync')}</span><b>同步</b><span>${state.online?'刚刚完成':'等待连接'}</span></div><div class="card status-cell"><span class="mini-icon">${icon('sound')}</span><b>声音</b><span>${state.settings.sound}% · 供电正常</span></div></div>${sectionHead('功能状态')}<div class="menu-list">${toggleItem('运动识别','自动记录七种动作',true,'recognition')}${toggleItem('体态陪伴','低头、距离和久坐提醒',state.settings.posture,'posture')}${toggleItem('主动提醒','邀请孩子完成轻量运动',state.settings.reminder,'reminder')}${toggleItem('免打扰','21:00～07:00',state.settings.quiet,'quiet')}</div>${sectionHead('最近设备活动')}<div class="card timeline">${state.activities.map(x=>`<div class="timeline-item"><time>${x.time}</time><span class="timeline-dot"></span><span><b>${x.title}</b><p>${x.sub}</p></span></div>`).join('')}</div><button class="secondary" style="width:100%;margin-top:12px" onclick="openPage('device_settings')">设备设置</button></div>`}
function toggleItem(title,sub,on,key){return `<button class="toggle-row" onclick="${key==='recognition'?"toast('运动识别为核心能力，保持开启')":`toggleSetting('${key}')`}"><span class="row-copy"><b>${title}</b><p>${sub}</p></span><span class="switch ${on?'on':''}"><i></i></span></button>`}
function toggleSetting(key){state.settings[key]=!state.settings[key];renderAll();toast(state.settings[key]?'已开启':'已关闭')}
function renderDeviceSettings(){return `${detailHead('设备设置','客厅运动伙伴')}<div class="app-body"><div class="menu-list">${menuItem('wifi','无线网络','已连接家庭网络','wifi')}${menuItem('camera','摄像头权限',state.settings.camera?'已授权':'未授权','camera')}${menuItem('sound','声音',state.settings.sound+'%','sound')}${menuItem('posture','体态陪伴',state.settings.posture?'开启':'关闭','posture')}${menuItem('bell','主动运动提醒',state.settings.reminder?'开启':'关闭','reminder')}${menuItem('moon','免打扰','21:00～07:00','quiet')}${menuItem('edit','设备名称','客厅运动伙伴','device_name')}${menuItem('sync','重新连接','连接异常时使用','reconnect')}${menuItem('shield','隐私说明','摄像头和运动数据说明','privacy')}</div><button class="danger" style="width:100%;margin-top:14px" onclick="toast('这是原型演示，未执行解绑')">解绑设备</button></div>`}
function renderLibrary(){return `${detailHead('七种AI运动','机器人可自动识别并记录')}<div class="app-body"><div class="action-grid">${actions.map(actionCard).join('')}</div></div>`}
function renderActionDetail(){const x=a();return `${detailHead(x.name,x.type)}<div class="app-body"><section class="card summary-box"><div class="action-art" style="height:90px;justify-content:center">${actionIcon(72)}</div><h3 style="text-align:center">建议目标 ${x.target}${x.unit}</h3><p style="text-align:center">${x.hint}</p></section><div class="status-grid" style="margin-top:10px"><div class="card status-cell"><b>${x.id==='plank'?'60秒':'42次'}</b><span>最近最好</span></div><div class="card status-cell"><b>6次</b><span>历史记录</span></div></div><div class="card summary-box" style="margin-top:10px"><h3>如何站位</h3><p>${['push_up','sit_up','plank'].includes(x.id)?'将设备放在身体侧前方，确保完整身体出现在画面中。':'站在设备前方，后退到机器人能看到完整身体的位置。'}</p><h3>机器人如何记录</h3><p>${x.id==='plank'?'姿势满足规则时累计有效保持时长。':'识别一次完整动作周期后增加一次；识别不确定时不会盲目计数。'}</p></div><button class="primary" style="width:100%;margin-top:12px" onclick="sendAction('${x.id}',${x.target},'自主运动')">发送机器人开始</button>${!state.online?'<div class="disclaimer">设备当前离线，任务会在设备上线后同步。</div>':''}</div>`}
function renderRecords(){return `${detailHead('最近运动','每一次真实运动都会留下记录')}<div class="app-body">${state.records.map(recordRow).join('')}</div>`}
function renderReport(){const r=state.records.find(x=>String(x.id)===String(state.selectedReport))||state.records[0];return `${detailHead('单次运动记录',r.date)}<div class="app-body"><section class="card summary-box" style="text-align:center"><small style="color:var(--muted)">${r.name}</small><div class="big-number" style="margin:10px 0">${r.actual}<span style="font-size:14px"> / ${r.target}${r.unit}</span></div><span class="tag">${r.status}</span></section><div class="status-grid" style="margin-top:10px"><div class="card status-cell"><b>${Math.max(1,Math.ceil(r.duration/60))}分钟</b><span>运动时长</span></div><div class="card status-cell"><b>${r.source}</b><span>任务来源</span></div><div class="card status-cell"><b>+${r.stars}</b><span>运动星</span></div><div class="card status-cell"><b>${r.date.includes('今天')?'今天':'历史'}</b><span>记录时间</span></div></div></div>`}
function renderProfile(){return `${detailHead('儿童档案','资料由家长管理')}<div class="app-body"><section class="card summary-box" style="text-align:center">${avatar()}<h3>${state.profileName}</h3><button class="secondary" onclick="$('#avatarInput').click()">设置头像</button></section><div class="form-label">姓名</div><input id="profileNameInput" class="text-input" value="${state.profileName}"><div class="form-label">年龄</div><input class="text-input" value="9岁"><div class="form-label">年级</div><input class="text-input" value="三年级"><div class="form-label">身高（厘米）</div><input id="heightInput" class="text-input" type="number" min="50" max="220" value="${state.childData.height}"><div class="form-label">体重（千克）</div><input id="weightInput" class="text-input" type="number" min="5" max="200" step="0.1" value="${state.childData.weight}"><p class="data-note">数据用于个性化运动建议，不做医疗判断。</p><button class="primary" style="width:100%;margin-top:14px" onclick="saveProfile()">保存</button></div>`}
function uploadAvatar(e){const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{state.avatarImage=reader.result;renderAll();toast('头像已更新')};reader.readAsDataURL(f)}
function saveProfile(){const el=$('#profileNameInput');const h=$('#heightInput');const w=$('#weightInput');if(el&&el.value.trim())state.profileName=el.value.trim();const height=Number(h&&h.value);const weight=Number(w&&w.value);if(Number.isFinite(height)&&height>0&&Number.isFinite(weight)&&weight>0)state.childData={height:Math.round(height),weight:Math.round(weight*10)/10,updated:'今天'};renderAll();toast('儿童档案已保存')}
function renderPosture(){return `${detailHead('体态陪伴','日常活动提醒，不是医疗判断')}<div class="app-body"><section class="card growth-summary"><small style="color:var(--muted)">今日提醒</small><div class="big-number">${state.lowHead}<span style="font-size:13px">次</span></div><div class="summary-row"><div><b>2次</b><span>久坐</span></div><div><b>1次</b><span>低头</span></div><div><b>0次</b><span>距离过近</span></div></div></section><div class="disclaimer">体态陪伴只用于日常活动提醒，不用于疾病判断或医疗诊断。</div><button class="primary" style="width:100%;margin-top:12px" onclick="scenarioPosture()">在机器人上演示提醒</button></div>`}
function renderSchool(){return `${detailHead('学校任务','阳光小学 · 三年级2班')}<div class="app-body"><section class="card summary-box"><h3>双脚跳绳 50次</h3><p>李老师发布 · 今天截止 · 目标不可修改</p></section><button class="primary" style="width:100%;margin-top:12px" onclick="sendSchool()">发送到机器人</button></div>`}
function renderSimpleDetail(){const labels={notifications:['消息通知','暂无新的重要消息'],family:['家庭成员','妈妈为主要监护人'],school_bind:['学校绑定','阳光小学 · 三年级2班'],privacy:['隐私与安全','查看摄像头和运动数据授权'],quiet:['免打扰','21:00～07:00'],help:['帮助与反馈','常见问题与问题反馈'],about:['关于','儿童AI运动陪伴机器人'],best:['个人最好成绩','只与自己的历史表现比较'],achievements:['运动成就','连续运动7天'],wifi:['无线网络','已连接家庭网络'],camera:['摄像头权限','用于运动识别和体态陪伴'],sound:['声音','当前音量60%'],reminder:['主动运动提醒','每天最多提醒两次'],device_name:['设备名称','客厅运动伙伴'],reconnect:['重新连接','设备会重新检查网络连接']};const x=labels[state.page]||['功能说明','内容正在整理'];return `${detailHead(x[0],'设置与说明')}<div class="app-body"><section class="card summary-box"><h3>${x[1]}</h3><p>这里提供家长需要的简明信息，不展示设备主控、网络地址或算法参数等开发内容。</p></section></div>`}

function openTaskSheet(){state.taskStep=1;state.taskDraft={type:'action',choice:'jumping_jack',target:20,time:'现在',device:'客厅运动伙伴'};state.sheet='task';renderSheet()}
function renderSheet(){const o=$('#sheetOverlay'),box=$('#sheetContent');if(!state.sheet){o.classList.remove('open');return}o.classList.add('open');$('#sheetTitle').textContent='创建家庭任务';const s=state.taskStep,d=state.taskDraft;let body='';if(s===1)body=`<div class="form-label">步骤1 · 选择任务类型</div>${choiceButtons(['单项运动','已保存训练计划'],d.type==='action'?'单项运动':'已保存训练计划','setTaskType')}`;if(s===2)body=`<div class="form-label">步骤2 · 选择内容</div>${d.type==='action'?`<div class="action-grid">${actions.map(x=>`<button class="action-card ${d.choice===x.id?'selected':''}" onclick="chooseTask('${x.id}')"><span class="action-art">${actionIcon(30)}</span><b>${x.name}</b><span>${x.target}${x.unit}</span></button>`).join('')}</div>`:state.savedPlans.length?state.savedPlans.map(p=>`<button class="question-chip" onclick="chooseTask('${p.id}')">${p.name}<span style="float:right">${d.choice===p.id?'✓':'›'}</span></button>`).join(''):'<div class="card empty-plan"><b>还没有已保存计划</b><p>请先从AI入口生成并保存训练计划。</p></div>'}`;if(s===3)body=`<div class="form-label">步骤3 · 设置目标</div>${d.type==='action'?`<div class="target-control"><button onclick="changeTaskTarget(-5)">−</button><strong>${d.target}${actions.find(x=>x.id===d.choice)?.unit||'次'}</strong><button onclick="changeTaskTarget(5)">＋</button></div>`:'<div class="card summary-box"><p>训练计划的动作和目标由已保存计划确定。</p></div>'}`;if(s===4)body=`<div class="form-label">步骤4 · 选择时间</div>${choiceButtons(['现在','今天19:00','明天19:00'],d.time,'setTaskTime')}`;if(s===5)body=`<div class="form-label">步骤5 · 选择机器人</div><button class="question-chip" onclick="state.taskDraft.device='客厅运动伙伴';renderSheet()">客厅运动伙伴 · ${state.online?'在线':'离线'} <span style="float:right">✓</span></button>`;if(s===6){const name=d.type==='action'?actions.find(x=>x.id===d.choice)?.name:state.savedPlans.find(x=>x.id===d.choice)?.name;body=`<div class="form-label">步骤6 · 确认任务</div><div class="card summary-box"><ul><li>内容：${name||'未选择'}</li><li>目标：${d.type==='action'?d.target+(actions.find(x=>x.id===d.choice)?.unit||'次'):'按训练计划执行'}</li><li>时间：${d.time}</li><li>机器人：${d.device}</li></ul></div>`}box.innerHTML=`${progress(s,6)}${body}<div class="wizard-actions"><button class="secondary" onclick="${s>1?'state.taskStep--;renderSheet()':'closeSheet()'}">${s>1?'上一步':'取消'}</button><button class="primary" onclick="${s<6?'nextTaskStep()':'confirmTask()'}">${s<6?'下一步':'确认发送'}</button></div>`}
function setTaskType(x){state.taskDraft.type=x==='单项运动'?'action':'plan';state.taskDraft.choice=state.taskDraft.type==='action'?'jumping_jack':state.savedPlans[0]?.id||'';renderSheet()}function chooseTask(id){state.taskDraft.choice=id;const x=actions.find(a=>a.id===id);if(x)state.taskDraft.target=x.target;renderSheet()}function changeTaskTarget(n){state.taskDraft.target=Math.max(5,Math.min(200,state.taskDraft.target+n));renderSheet()}function setTaskTime(x){state.taskDraft.time=x;renderSheet()}function nextTaskStep(){if(state.taskStep===2&&state.taskDraft.type==='plan'&&!state.taskDraft.choice)return toast('请先生成并保存训练计划');state.taskStep++;renderSheet()}function confirmTask(){const d=state.taskDraft;closeSheet();if(d.type==='action')sendAction(d.choice,d.target,'家庭任务');else sendTodayPlan(d.choice)}function closeSheet(){state.sheet=null;renderSheet()}function closeSheetOnBackdrop(e){if(e.target.id==='sheetOverlay')closeSheet()}

function sendAction(id,target,source){const x=actions.find(a=>a.id===id);state.action=id;state.target=target;state.count=0;state.duration=0;state.pending={type:'action',source,name:x.name,target,unit:x.unit};state.dmode='alert_task';state.eye='alert';state.activities.unshift({time:'刚刚',title:'收到'+source,sub:x.name+target+x.unit});renderAll();toast(state.online?'任务已发送，机器人收到提醒':'设备离线，任务会在上线后同步')}
function sendSchool(){state.schoolStatus='已发送';state.action='jump_rope';state.target=50;state.count=0;state.duration=0;state.pending={type:'school',source:'学校任务',name:'双脚跳绳',target:50,unit:'次'};state.dmode='alert_task';state.eye='alert';renderAll();toast('学校任务已发送')}
function eyeMarkup(cls=state.eye){return `<div class="eyes ${cls==='normal'?'auto-blink':cls}"><div class="eye"><i class="pupil"></i></div><div class="eye"><i class="pupil"></i></div></div>`}
function dots(){return `<div class="page-dots">${[0,1,2,3].map(i=>`<i class="${i===state.watchHubIndex?'on':''}"></i>`).join('')}</div>`}
function arrows(){return `<button class="screen-arrow left" onclick="event.stopPropagation();watchPrev()" aria-label="向左滑动">‹</button><button class="screen-arrow right" onclick="event.stopPropagation();watchNext()" aria-label="向右滑动">›</button>`}
function renderDevice(){const d=$('#deviceScreen');let h='';if(state.dmode==='idle'){const anim=state.watchDirection==='next'?'slide-next':'slide-prev';if(state.watchHubIndex===0)h=`<div class="device-view ${anim}" onclick="deviceTap(event)">${state.pending?'<i class="task-dot"></i>':''}${eyeMarkup()}</div>`;if(state.watchHubIndex===1)h=`<div class="device-view ${anim}"><div class="device-kicker">快速开始</div><h2 class="device-title">今天想动一动吗？</h2><p class="device-copy">选择一种运动，机器人会自动记录</p><div class="device-actions"><button class="primary" onclick="deviceStartSelect()">开始选择</button></div></div>`;if(state.watchHubIndex===2)h=`<div class="device-view ${anim}"><div class="device-kicker">我的任务</div><h2 class="device-title">${state.pending?'有1个新任务':'今天已完成1项'}</h2><p class="device-copy">${state.pending?state.pending.name+' · '+state.pending.target+state.pending.unit:'左右滑动查看其他功能'}</p><div class="device-actions">${state.pending?'<button class="primary" onclick="startPending()">查看任务</button>':''}</div></div>`;if(state.watchHubIndex===3)h=`<div class="device-view ${anim}">${eyeMarkup('happy')}<h2 class="device-title">${state.online?'连接正常':'网络已断开'}</h2><p class="device-copy">${state.online?'我已经准备好陪你运动':'运动记录会保留，等待重新连接'}</p></div>`;h+=arrows()+dots()}else if(state.dmode==='select')h=`<div class="device-view"><div class="device-kicker">选择运动</div><h2 class="device-title">想练哪一个？</h2><div class="device-grid">${actions.map(x=>`<button onclick="deviceChoose('${x.id}')">${actionIcon(25)}<b>${x.name}</b><span>${x.type}</span></button>`).join('')}</div><div class="device-actions"><button onclick="deviceIdle()">返回</button></div></div>`;else if(state.dmode==='target')h=`<div class="device-view"><div class="device-kicker">${a().type}</div><h2 class="device-title">${a().name}</h2><div class="target-box"><button onclick="deviceTarget(-5)">−</button><strong>${state.target}<small>${a().unit}</small></strong><button onclick="deviceTarget(5)">＋</button></div><div class="device-actions"><button onclick="state.dmode='select';renderDeviceOnly()">返回</button><button class="primary" onclick="deviceEntry('far')">开始</button></div></div>`;else if(state.dmode==='entry')h=`<div class="device-view"><div class="body-outline"></div><h2 class="device-title">${state.entry==='good'?'很好，就站这里！':'让我看到完整的你'}</h2><p class="device-copy">${state.entry==='good'?'马上准备开始':'站到我前面，再往后一点点'}</p></div>`;else if(state.dmode==='ready')h=`<div class="device-view">${eyeMarkup('focus')}<h2 class="device-title">准备好啦！</h2></div>`;else if(state.dmode==='countdown')h=`<div class="device-view"><div class="countdown" id="countdownNum">3</div></div>`;else if(state.dmode==='running'){const pct=Math.min(100,state.count/state.target*100);h=`<div class="device-view"><div class="device-kicker">${a().name}</div><div class="big-count" id="bigCount">${state.count}<small>${a().id==='plank'?'秒':' / '+state.target}</small></div><div class="device-progress"><i style="width:${pct}%"></i></div><div class="feedback" id="feedback">${feedbackText()}</div><div class="run-controls"><button onclick="pauseWorkout()">暂停</button><button onclick="finishWorkout(false)">结束</button></div></div>`}else if(state.dmode==='pause')h=`<div class="device-view">${eyeMarkup('sleepy')}<h2 class="device-title">休息一下～</h2><p class="device-copy">${state.count} / ${state.target}，我帮你记住啦</p><div class="device-actions"><button class="primary" onclick="resumeWorkout()">继续</button><button onclick="finishWorkout(false)">结束</button></div></div>`;else if(state.dmode==='away')h=`<div class="device-view">${eyeMarkup('look-left')}<h2 class="device-title">我在等你～</h2><p class="device-copy">已经帮你记住${state.count}${a().unit}</p><div class="device-actions"><button class="primary" onclick="returnWorkout()">我回来了</button></div></div>`;else if(state.dmode==='celebrate')h=`<div class="device-view">${eyeMarkup('celebrate')}<h2 class="device-title">完成啦！</h2><p class="device-copy">${state.count} / ${state.target} · +8运动星</p></div>`;else if(state.dmode==='result')h=`<div class="device-view"><div class="device-kicker">这次运动</div><h2 class="device-title">${state.pending?.name||a().name}</h2><div class="big-count" style="font-size:72px">完成</div><p class="device-copy">结果已经同步给家长</p><div class="device-actions"><button class="primary" onclick="deviceIdle(true)">完成</button></div></div>`;else if(state.dmode==='alert_task'){const p=state.pending;h=`<div class="device-view">${eyeMarkup('alert')}<div class="device-kicker">${p.source==='学校任务'?'老师':'家长'}发来新任务</div><h2 class="device-title">${p.name}</h2><p class="device-copy">目标 ${p.target}${p.unit}</p><div class="device-actions"><button onclick="deviceIdle()">稍后</button><button class="primary" onclick="startPending()">开始</button></div></div>`}else if(state.dmode==='plan_alert'){const p=state.pending;h=`<div class="device-view">${eyeMarkup('curious')}<div class="device-kicker">今天的新计划来啦～</div><h2 class="device-title">${p.name}</h2><p class="device-copy">${p.items.length}项运动，我会一步一步陪你完成</p><div class="device-actions"><button onclick="deviceIdle()">稍后</button><button class="primary" onclick="startPlan()">开始</button></div></div>`}else if(state.dmode==='plan_step'){const m=currentPlanItem();h=`<div class="device-view"><div class="device-kicker">第 ${state.planIndex+1} / ${state.pending.items.length} 项</div><h2 class="device-title">${m.name}</h2><div class="big-count" style="font-size:80px">${m.target}<small>${m.unit}</small></div><p class="device-copy">机器人会自动记录有效动作</p><div class="device-actions"><button onclick="pausePlan()">暂停</button><button class="primary" onclick="completePlanStep()">完成本项</button></div></div>`}else if(state.dmode==='plan_rest')h=`<div class="device-view">${eyeMarkup('happy')}<div class="device-kicker">短暂休息</div><h2 class="device-title">上一项完成！</h2><p class="device-copy">准备好后继续下一项</p><div class="device-actions"><button class="primary" onclick="continuePlan()">继续</button></div></div>`;else if(state.dmode==='posture')h=`<div class="device-view">${eyeMarkup('curious')}<h2 class="device-title">抬头休息一下吧～</h2><p class="device-copy">这是日常活动提醒，不是医疗判断</p><div class="device-actions"><button onclick="deviceIdle()">知道啦</button><button class="primary" onclick="postureMove()">活动一下</button></div></div>`;else if(state.dmode==='error')h=`<div class="device-view">${eyeMarkup('alert')}<h2 class="device-title">网络暂时断开</h2><p class="device-copy">运动结果已经保存，连接恢复后会自动同步</p><div class="device-actions"><button class="primary" onclick="setOnline(true)">重新连接</button></div></div>`;d.innerHTML=h;$('#deviceStatus').innerHTML=`客厅运动伙伴 · <b>${deviceStatusText()}</b> · 首页设备卡已同步`}
function watchNext(){if(state.dmode!=='idle')return;state.watchDirection='next';state.watchHubIndex=(state.watchHubIndex+1)%4;renderDeviceOnly()}function watchPrev(){if(state.dmode!=='idle')return;state.watchDirection='prev';state.watchHubIndex=(state.watchHubIndex+3)%4;renderDeviceOnly()}
function bindGestures(){let sx=0,sy=0,drag=false;const el=$('#deviceScreen');const end=(x,y)=>{if(!drag)return;drag=false;const dx=x-sx,dy=y-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))(dx<0?watchNext():watchPrev())};el.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;drag=true});el.addEventListener('pointerup',e=>end(e.clientX,e.clientY));el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;drag=true},{passive:true});el.addEventListener('touchend',e=>end(e.changedTouches[0].clientX,e.changedTouches[0].clientY),{passive:true})}
function deviceTap(e){const rect=e.currentTarget.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width;state.eye=x<.4?'look-left':x>.6?'look-right':'happy';renderDeviceOnly();setTimeout(()=>{if(state.dmode==='idle'){state.eye='normal';renderDeviceOnly()}},850)}
function deviceStartSelect(){state.pending=null;state.dmode='select';renderDeviceOnly()}function deviceChoose(id){state.action=id;state.target=actions.find(x=>x.id===id).target;state.count=0;state.duration=0;state.dmode='target';renderDeviceOnly()}function deviceTarget(n){state.target=Math.max(5,Math.min(200,state.target+n));renderDeviceOnly()}
function deviceEntry(pos='far'){clearTimers();state.entry=pos;state.dmode='entry';renderAll();entryTimer=setTimeout(()=>{state.entry='good';renderDeviceOnly();entryTimer=setTimeout(startReady,700)},900)}function startReady(){state.dmode='ready';state.eye='focus';renderDeviceOnly();entryTimer=setTimeout(startCountdown,800)}function startCountdown(){state.dmode='countdown';renderDeviceOnly();let n=3;countdownTimer=setInterval(()=>{n--;if(n<=0){clearInterval(countdownTimer);startWorkout()}else if($('#countdownNum'))$('#countdownNum').textContent=n},650)}
function startWorkout(){state.dmode='running';state.running=true;renderAll();workoutTimer=setInterval(()=>state.duration++,1000)}function addCount(n=1){if(state.dmode!=='running')return toast('请先进入运动中状态');state.count=Math.min(state.target,state.count+n);renderDeviceOnly();const el=$('#bigCount');if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}if(state.count>=state.target)finishWorkout(true)}function feedbackText(){if(state.count>=state.target)return'完成！';if(state.count>=Math.ceil(state.target*.75))return'快完成啦！';if(state.count>=Math.ceil(state.target*.5))return'一半啦！';if(state.count>=5)return'做得不错！';return''}
function pauseWorkout(){if(state.dmode!=='running')return;clearInterval(workoutTimer);state.running=false;state.dmode='pause';renderAll()}function resumeWorkout(){state.dmode='running';state.running=true;renderAll();workoutTimer=setInterval(()=>state.duration++,1000)}function deviceAway(){if(!['running','entry'].includes(state.dmode))return toast('请先进入运动流程');clearInterval(workoutTimer);state.running=false;state.dmode='away';renderAll()}function returnWorkout(){startReady()}
function finishWorkout(done){if(!['running','pause'].includes(state.dmode)&&!done)return;clearInterval(workoutTimer);state.running=false;if(done)state.count=state.target;createRecord(a().name,'动作',state.count,state.target,a().unit,state.duration,done?'已完成':'提前结束',state.pending?.source||'自主运动');state.dmode='celebrate';state.eye='celebrate';renderAll();entryTimer=setTimeout(()=>{state.dmode='result';renderAll()},1600)}
function createRecord(name,kind,actual,target,unit,duration,status,source){state.records.unshift({id:Date.now(),name,kind,actual,target,unit,duration:Math.max(1,duration),status,source,date:'今天 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),stars:8});state.stars+=8;state.activities.unshift({time:'刚刚',title:'完成'+name,sub:'运动结果已同步'});if(source==='学校任务')state.schoolStatus='已完成'}
function deviceIdle(clear=false){clearTimers();state.dmode='idle';state.eye='normal';state.watchHubIndex=0;state.running=false;if(clear)state.pending=null;renderAll()}function startPending(){const p=state.pending;if(!p)return deviceIdle();if(p.type==='plan')return startPlan();state.action=p.type==='school'?'jump_rope':state.action;state.target=p.target;state.count=0;state.duration=0;deviceEntry('far')}
function currentPlanItem(){return state.pending?.items?.[state.planIndex]}function startPlan(){state.planIndex=0;state.dmode='plan_step';state.eye='focus';renderAll()}function pausePlan(){state.dmode='plan_rest';renderAll()}function continuePlan(){state.dmode='plan_step';renderAll()}function completePlanStep(){state.planIndex++;if(state.planIndex<state.pending.items.length){state.dmode='plan_rest';renderAll()}else{const name=state.pending.name;createRecord(name,'计划',state.pending.items.length,state.pending.items.length,'项',Math.max(480,state.duration),'已完成','AI计划');state.count=state.pending.items.length;state.target=state.pending.items.length;state.dmode='celebrate';state.eye='celebrate';renderAll();entryTimer=setTimeout(()=>{state.dmode='result';renderAll()},1600)}}
function postureMove(){state.action='jumping_jack';state.target=15;state.count=0;state.duration=0;state.pending={type:'action',source:'体态提醒',name:'开合跳',target:15,unit:'次'};deviceEntry('far')}
function setOnline(on){state.online=on;if(!on)state.dmode='error';else if(state.dmode==='error')deviceIdle();renderAll();toast(on?'设备已重新连接':'设备已离线，记录会保留')}
function setEye(x){state.eye=x;state.dmode='idle';state.watchHubIndex=0;renderDeviceOnly()}
function renderDebug(){if(!state.debug)return;$('#debugState').textContent=`${deviceStatusText()} · ${state.dmode}`;$('#debugAI').textContent=`训练计划：${state.aiPlan?'已生成':'未生成'}；已保存：${state.savedPlans.length}；食谱：${state.mealPlan?'已生成':'未生成'}；待执行：${state.pending?.type||'无'}`}
function toggleDebug(){state.debug=!state.debug;renderAll()}function clearTimers(){clearTimeout(entryTimer);clearInterval(countdownTimer);clearInterval(workoutTimer)}function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function scenarioDevice(){state.tab='home';state.page='device';state.history=['root'];deviceIdle();renderAll()}function scenarioFamily(){state.tab='tasks';state.page='root';state.taskView='today';state.taskFilter='family';renderAll();openTaskSheet()}function scenarioSelf(){state.tab='home';state.page='root';state.watchHubIndex=1;state.dmode='idle';renderAll()}function scenarioPlan(){openAIPlan()}function scenarioMeal(){openAIMeal()}function scenarioPosture(){state.lowHead++;state.dmode='posture';state.eye='curious';state.tab='home';state.page='posture';state.history=['root'];renderAll()}function scenarioSchool(){state.tab='tasks';state.page='school';state.history=['root'];renderAll()}
function resetProduct(){clearTimers();state=initialState();renderAll();toast('产品状态已重置')}
renderAll();bindGestures();
</script>
