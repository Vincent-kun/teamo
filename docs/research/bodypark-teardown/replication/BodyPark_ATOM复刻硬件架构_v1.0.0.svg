<text x="88" y="1578" text-anchor="start" class="title">调试焊盘（1.8V）</text>
<text x="88" y="1608" text-anchor="start" class="body">UART0_TX / UART0_RX / GND</text>
<text x="88" y="1631" text-anchor="start" class="body">用于 MaskROM、BSP 与启动调试</text>
<rect x="860" y="590" width="420" height="190" class="box"/>
<rect x="876" y="602" width="84" height="26" rx="13" class="tag"/>
<text x="918.0" y="620" text-anchor="middle" class="tiny" fill="#fff" style="font-weight:700;">原机确认</text>
<text x="878" y="660" text-anchor="start" class="title">U1201｜FORESEE F35SQB004G‑WWT</text>
<text x="878" y="690" text-anchor="start" class="body">4Gbit / 512MiB · QSPI NAND</text>
<text x="878" y="713" text-anchor="start" class="body">用于 Boot 与系统存储</text>
<rect x="1510" y="590" width="500" height="220" class="dash"/>
<text x="1528" y="628" text-anchor="start" class="title">原机电源 / 模拟小器件组</text>
<text x="1528" y="658" text-anchor="start" class="body">U2001 ADJ4T · U2003 ADJ4H</text>
<text x="1528" y="681" text-anchor="start" class="body">U2004 ADJ4T · U2005 FAF9</text>
<text x="1528" y="704" text-anchor="start" class="body">完整型号与各自 rail/功能待导通确认</text>
<rect x="920" y="860" width="980" height="780" class="soft"/>
<text x="955" y="920" class="title">U1000｜Rockchip RV1106B</text>
<text x="955" y="952" class="body">QFN88 · Cortex‑A7 + MCU · 0.5 TOPS NPU · DDR 配置以正式资料冻结</text>
<text x="955" y="980" class="body">主要接口：MIPI CSI、FSPI0、FSPI1、SDMMC0/1、UART、I²C、USB2、内置模拟 Codec</text>
<rect x="955" y="1030" width="260" height="135" class="note"/>
<text x="973" y="1068" text-anchor="start" class="title">CPU / MCU</text>
<text x="973" y="1098" text-anchor="start" class="body">Cortex‑A7 + HPMCU</text>
<rect x="1240" y="1030" width="230" height="135" class="note"/>
<text x="1258" y="1068" text-anchor="start" class="title">NPU</text>
<text x="1258" y="1098" text-anchor="start" class="body">0.5 TOPS</text>
<rect x="1495" y="1030" width="220" height="135" class="note"/>
<text x="1513" y="1068" text-anchor="start" class="title">ISP</text>
<text x="1513" y="1098" text-anchor="start" class="body">单路摄像头采集</text>
<rect x="955" y="1188" width="260" height="135" class="note"/>
<text x="973" y="1226" text-anchor="start" class="title">Video Enc</text>
<text x="973" y="1256" text-anchor="start" class="body">H.264 / H.265</text>
<rect x="1240" y="1188" width="230" height="135" class="note"/>
<text x="1258" y="1226" text-anchor="start" class="title">ACODEC</text>
<text x="1258" y="1256" text-anchor="start" class="body">MIC_P/N · LINEOUT</text>
<rect x="1495" y="1188" width="220" height="135" class="note"/>
<text x="1513" y="1226" text-anchor="start" class="title">DDR / SiP</text>
<text x="1513" y="1256" text-anchor="start" class="body">容量 / 类型 / 电压待冻结</text>
<rect x="955" y="1360" width="720" height="165" class="note"/>
<text x="973" y="1398" text-anchor="start" class="title">关键接口摘要</text>
<text x="973" y="1428" text-anchor="start" class="body">• MIPI CSI → 原机 Camera（Lane 数/Pinout 待确认）</text>
<text x="973" y="1451" text-anchor="start" class="body">• FSPI0 → F35 SPI NAND    • 圆屏接口按 CN06 实机导通</text>
<text x="973" y="1474" text-anchor="start" class="body">• UW01 NL‑H853‑SSA1：Host 接口/BT 实现待实机日志与导通</text>
<text x="973" y="1497" text-anchor="start" class="body">• SDMMC0 → microSD    • USB2 → Type‑C</text>
<text x="973" y="1520" text-anchor="start" class="body">• UART0 → 调试    • 充电/触摸/控制总线以原机实测冻结</text>
<rect x="955" y="1555" width="720" height="70" class="dash"/>
<text x="973" y="1593" text-anchor="start" class="title">设计边界</text>
<text x="973" y="1623" text-anchor="start" class="body">主控/存储/无线模组等按原机优先；未知控制脚与电源 rail 以 EVT 实测闭环</text>
<rect x="2140" y="590" width="1680" height="280" class="dash"/>
<text x="2158" y="628" text-anchor="start" class="title">CN06｜原机 1.43" 圆形显示模组</text>
<text x="2158" y="658" text-anchor="start" class="body">466×466 · OLED/AMOLED 表述待面板拆解确认</text>
<text x="2158" y="681" text-anchor="start" class="body">驱动 IC / 触控 IC / Host 接口均以原机 FPC 导通为准</text>
<text x="2158" y="704" text-anchor="start" class="body">驱动 IC / 触控 IC / Host 接口均待原机实测确认</text>
<rect x="2140" y="915" width="1680" height="260" class="dash"/>
<text x="2158" y="953" text-anchor="start" class="title">UW01｜AI‑Link NL‑H853‑SSA1（原机）</text>
<text x="2158" y="983" text-anchor="start" class="body">2.4GHz 无线模组；Host 接口待导通/启动日志确认</text>
<text x="2158" y="1006" text-anchor="start" class="body">产品支持 BT 5.0；是否同模组及 HCI 接口待确认</text>
<text x="2158" y="1029" text-anchor="start" class="body">WL/BT REG_ON、HOST_WAKE 由 原机电源 / 模拟小器件组管理</text>
<rect x="2140" y="1215" width="780" height="185" class="box"/>
<text x="2158" y="1253" text-anchor="start" class="title">CN04｜microSD</text>
<text x="2158" y="1283" text-anchor="start" class="body">3.3V · 4‑bit</text>
<text x="2158" y="1306" text-anchor="start" class="body">CLK/CMD/D0-D3/DET</text>
<rect x="2960" y="1215" width="860" height="185" class="box"/>
<text x="2978" y="1253" text-anchor="start" class="title">JA1｜原机扬声器 / 模拟链路</text>
<text x="2978" y="1283" text-anchor="start" class="body">功放/驱动完整型号待确认</text>
<text x="2978" y="1306" text-anchor="start" class="body">保留 RV1106B Codec → 原机模拟链路 → Speaker</text>
<text x="2978" y="1329" text-anchor="start" class="body">AMP_EN 由 原机电源 / 模拟小器件组控制</text>
<rect x="2140" y="1440" width="1680" height="170" class="box"/>
<text x="2158" y="1478" text-anchor="start" class="title">CN01｜USB Type‑C（5V/2A）</text>
<text x="2158" y="1508" text-anchor="start" class="body">USB2 D+ / D− → RV1106B；VBUS → 充电管理</text>
<text x="2158" y="1531" text-anchor="start" class="body">CC1/CC2 下拉；ESD 保护；仅 USB2 Device/UFP</text>
<rect x="2140" y="1650" width="1680" height="190" class="note"/>

<rect x="2970" y="1470" width="790" height="300" class="box"/>
