<text x="2990" y="1542" class="body">Y1101｜JWT2602CC</text>
<text x="2990" y="1568" class="body">Y1100｜YL240 · YL3h</text>
<text x="2990" y="1594" class="body">JW01｜BAT‑ANT2‑T3518 · 2.4GHz 天线</text>
<text x="2990" y="1620" class="body">UP5｜WP10 · UP4｜TOG1V1 · UP3｜S358dL1</text>
<text x="2990" y="1646" class="small">完整器件身份/用途以封装、外围与导通确认；不强行猜型。</text>
