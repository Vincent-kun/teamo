<text x="55" y="240" class="section">电源 / 充电 / 系统 Power Tree</text>
<rect x="70" y="280" width="560" height="115" class="soft"/>
<text x="350.0" y="318" text-anchor="middle" class="title">CN01 USB‑C 口</text>
<text x="350.0" y="348" text-anchor="middle" class="body">5V / 2A</text>
<text x="350.0" y="371" text-anchor="middle" class="body">USB2 D+/D− · CC1/CC2 下拉</text>
<rect x="680" y="280" width="560" height="115" class="soft"/>
<text x="960.0" y="318" text-anchor="middle" class="title">UP1｜原机充电 / 电源管理</text>
<text x="960.0" y="348" text-anchor="middle" class="body">顶标 E1831（完整型号待确认）</text>
<text x="960.0" y="371" text-anchor="middle" class="body">原机位号/顶标优先；接口与 Power Path 待导通</text>
<rect x="1290" y="280" width="520" height="115" class="soft"/>
<text x="1550.0" y="318" text-anchor="middle" class="title">CN02 电池包</text>
<text x="1550.0" y="348" text-anchor="middle" class="body">1S Li‑ion 3.7V</text>
<text x="1550.0" y="371" text-anchor="middle" class="body">2000mAh · 7.4Wh · NTC</text>
<rect x="1860" y="280" width="600" height="115" class="soft"/>
<text x="2160.0" y="318" text-anchor="middle" class="title">原机稳压 / 模拟器件组</text>
<text x="2160.0" y="348" text-anchor="middle" class="body">UP4 TOG1V1 · UP5 WP10</text>
<text x="2160.0" y="371" text-anchor="middle" class="body">各 rail 由实机导通/波形确认，不按替代料预设</text>
<rect x="2510" y="280" width="510" height="115" class="soft"/>
<text x="2765.0" y="318" text-anchor="middle" class="title">UP3｜原机器件</text>
<text x="2765.0" y="348" text-anchor="middle" class="body">顶标 S358dL1</text>
<text x="2765.0" y="371" text-anchor="middle" class="body">具体模拟/电源功能待板级导通确认</text>
<rect x="3070" y="280" width="730" height="115" class="soft"/>
<text x="3435.0" y="318" text-anchor="middle" class="title">RV1106B 供电域</text>
<text x="3435.0" y="348" text-anchor="middle" class="body">原机电源树：电压/时序以实测 + 正式资料冻结</text>
<text x="3435.0" y="371" text-anchor="middle" class="body">U200x 顶标组纳入对标，不用替代芯片先行假设</text>
