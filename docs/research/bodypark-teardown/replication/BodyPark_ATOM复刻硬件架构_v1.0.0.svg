<title id="title">BodyPark ATOM 原机对标复刻硬件架构 v1.0.0</title>
<desc id="desc">BodyPark ATOM 原机对标复刻硬件架构正式版，主控 RV1106B。优先采用原机实物已确认器件、位号与顶标；未知器件不强行猜型。</desc>
