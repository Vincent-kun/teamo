<path d="M1810 338 L1860 338" class="rail"/>
<path d="M2460 338 L2510 338" class="rail"/>
<path d="M3020 338 L3070 338" class="rail"/>
<text x="70" y="430" class="small">VBUS 5V 与 1S 电池构成原机供电入口；UP1/UP3/UP4/UP5/U200x 的真实 rail、Power Path 与时序必须通过导通/示波确认。</text>
