<text x="42" y="80" class="h1">BodyPark ATOM｜原机对标复刻硬件架构</text>
<text x="42" y="125" class="sub">正式版 · v1.0.0 · 原机器件优先基线 · 主控 RV1106B</text>
<text x="3850" y="80" text-anchor="end" class="sub">核心：RV1106B</text>
<text x="3850" y="125" text-anchor="end" class="hint">文档版本：1.0.0</text>

