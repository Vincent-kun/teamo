<text x="2115" y="525" class="section">C｜显示、连接、存储与音频输出</text>
<rect x="70" y="590" width="680" height="370" class="box"/>
<rect x="86" y="602" width="84" height="26" rx="13" class="tag"/>
<text x="128.0" y="620" text-anchor="middle" class="tiny" fill="#fff" style="font-weight:700;">原机规格</text>
<text x="88" y="660" text-anchor="start" class="title">原机 5MP 超广角相机模块</text>
<text x="88" y="690" text-anchor="start" class="body">PCB 标识 H9M6167B00300Q…（已见）</text>
<text x="88" y="713" text-anchor="start" class="body">1/2.8" CMOS · 160° 超广角 · Sensor 具体料号待确认</text>
<text x="88" y="736" text-anchor="start" class="body">原机 FPC → RV1106B MIPI CSI（Lane 数待实测）</text>
<text x="88" y="759" text-anchor="start" class="body">I²C / MCLK / RESET 等控制脚按原机导通冻结</text>
<rect x="70" y="1010" width="680" height="250" class="box"/>
<text x="88" y="1048" text-anchor="start" class="title">UM01｜原机 MEMS 麦克风</text>
<text x="88" y="1078" text-anchor="start" class="body">顶标 o519 BTC</text>
<text x="88" y="1101" text-anchor="start" class="body">封装/模拟接口按原板导通确认</text>
<text x="88" y="1124" text-anchor="start" class="body">保留原机偏置/滤波/地分区布局思路</text>
<rect x="70" y="1310" width="680" height="190" class="box"/>
<text x="88" y="1348" text-anchor="start" class="title">Power / Action 双按键</text>
<text x="88" y="1378" text-anchor="start" class="body">电阻编码 → SARADC_IN0</text>
<text x="88" y="1401" text-anchor="start" class="body">Power 键同步拉低 nQON</text>
