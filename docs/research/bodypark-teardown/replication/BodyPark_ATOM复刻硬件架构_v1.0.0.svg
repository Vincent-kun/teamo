<rect x="30" y="1910" width="3840" height="550" class="zone"/>
<text x="55" y="1945" class="section">D｜设计结论 / 复刻约束 / 重点接口</text>
<rect x="70" y="1995" width="1030" height="180" class="note"/>
<text x="88" y="2033" text-anchor="start" class="title">复刻思路</text>
<text x="88" y="2063" text-anchor="start" class="body">以 RV1106B 为单 SoC 核心，优先复用原机 U1201/UW01/UP1/UP3/UP4/UP5/UM01/JW01 等已识别位号与器件顶标。</text>
<text x="88" y="2086" text-anchor="start" class="body">未知完整型号先按原机 footprint/电气实测冻结；仅在无法采购或无法识别时启用兼容替代。</text>
<rect x="1140" y="1995" width="1100" height="180" class="note"/>
<text x="1158" y="2033" text-anchor="start" class="title">关键互斥</text>
<text x="1158" y="2063" text-anchor="start" class="body">除 FSPI0→F35 与已确认外设外，屏/无线 PinMux 需通过原板导通、UART 日志与驱动节点确认真实连接。</text>
<text x="1158" y="2086" text-anchor="start" class="body">量产前必须冻结 PinMux、电源时序、CN06 初始化、NL‑H853‑SSA1 Host 接口与 BSP。</text>
<rect x="2275" y="1995" width="760" height="180" class="note"/>
<text x="2293" y="2033" text-anchor="start" class="title">证据口径</text>
<text x="2293" y="2063" text-anchor="start" class="body">“原机确认”仅限实物丝印、原文件或正式资料直接支持的事实。</text>
<text x="2293" y="2086" text-anchor="start" class="body">原机对标与原机规格须经 EVT 门禁闭环后再转为量产事实。</text>
<rect x="3070" y="1995" width="770" height="180" class="note"/>
<text x="3088" y="2033" text-anchor="start" class="title">仍需验证</text>
<text x="3088" y="2063" text-anchor="start" class="body">CN06 显示 Host 接口、Rockchip 上电时序、NL‑H853‑SSA1 Host/BT、U200x/UPx 完整身份。</text>
<text x="3088" y="2086" text-anchor="start" class="body">相机 Sensor/FPC、UM01 音频接口、Y1100/Y1101 时钟用途同样需在 EVT 中闭环。</text>
<rect x="70" y="2210" width="110" height="30" rx="14" class="legendW"/><text x="125" y="2231" text-anchor="middle" class="tiny" style="font-weight:700;">原机确认</text>
<rect x="210" y="2210" width="110" height="30" rx="14" class="legendG"/><text x="265" y="2231" text-anchor="middle" class="tiny" style="font-weight:700;">原机对标</text>
<rect x="350" y="2210" width="110" height="30" rx="14" class="legendD"/><text x="405" y="2231" text-anchor="middle" class="tiny" style="font-weight:700;">原机规格 / 待验证</text>
<text x="70" y="2280" class="small">注：正式版 v1.0.0；器件策略采用“原机优先”。主控固定 RV1106B，未知器件记录原机位号/顶标，不把替代料写成原机事实。</text>
</svg>